function restart() {
  activeSubKey = 'erebus'; // every new world starts at the bottom of the ladder
  state._outfitOffer = null;
  const sub = activeSub();
  clearSave(); // a fresh world supersedes any saved run
  state.q = 0; state.r = 0;
  state.air = sub.air; state.hull = sub.hull;
  state.currentDepth = 0; state.maxDepth = 0;
  state.moves = 0; state.poisFound = [];
  state.cargo = 0; state.cargoBanked = 0;
  state.relics = 0; state.relicsBanked = 0;
  state.expedition = null;
  state.alive = true;
  state.cameraX = 0; state.cameraY = 0;
  state.panX = 0; state.panY = 0;
  state.trail = [];
  state.failHex = null;
  state.ping = null;
  state.pingArrows = null;
  state.pingMemory = new Map();
  world.clear();
  cells.clear();
  revealed.clear();
  visited.clear();
  generatedChunks.clear();
  worldSeed = Date.now() & 0xffffffff;
  rng = mulberry32(worldSeed);
  nodeCache.clear(); // lattice + edge memos and the carve registry are seed-dependent
  edgeCache.clear();
  carvedFeatures.clear();
  spawnedChunks.clear();
  state.creatures = [];
  // Force-generate origin chunk and neighbors so the player can leave
  tileAt(0, 0);
  // Set initial depth to match origin tile's range (origin is shallow)
  const originTile = getTile(0, 0);
  if (originTile && !originTile.wall) {
    state.currentDepth = Math.max(0, originTile.ceiling);
  }
  // Reveal a generous initial sight area — the player needs to see the
  // dock, the shoreline, and enough water to chart a course.
  visited.add(hexKey(0, 0));
  for (let dq = -5; dq <= 5; dq++) {
    for (let dr = Math.max(-5, -dq-5); dr <= Math.min(5, -dq+5); dr++) {
      revealAt(dq, dr, 0); // initial surface reveal
    }
  }
  logEl.innerHTML = '';
  state.lastZone = 'shelf';
  state.maxZoneReached = 0;
  log(`A grey dock juts east into the chop. Behind you, the shore is rock and packed earth — the last solid ground for hundreds of miles. To the north and west, open water.`);
  log(`The ${sub.name} casts off. The hatch is open; the air is yours.`, '', 'CAST OFF');
  document.getElementById('gameover').classList.remove('show');
  // Cap ping power slider at sub's max
  const pp = document.getElementById('ping-power');
  if (pp) pp.max = sub.sonarMaxPower;
  gameStarted = true;
  updatePingDisplay();
  updateHUD();
  render();
  schedulePregen();
}

//=============================================================================
// SURFACE BUTTON — return to origin if you have a path
//=============================================================================

function surface() {
  if (!state.alive) return;
  const sub = activeSub();
  const tile = getTile(state.q, state.r);
  if (!tile || tile.wall) return;

  // At depth 0 in open water (anywhere on the shelf) — the hatch is open, refill air.
  const onSurface = state.currentDepth <= 0.5 && volumeContaining(tile, 0);
  if (onSurface) {
    // Make port: within hailing distance of the dock, cargo goes ashore.
    const atPort = hexDistance({q: state.q, r: state.r}, {q: 1, r: 1}) <= 4;
    // Far from home, surfacing is how you find it: a bearing off the sun.
    if (!atPort) {
      const km = (hexDistance({q: state.q, r: state.r}, {q: 1, r: 1}) * 60 / 1000).toFixed(1);
      log(`You take a bearing off the sun. The dock lies ${bearing(state.q, state.r, 1, 1)}, ${km} km as the gull flies.`, '', 'BEARING');
    }
    if (atPort && state.cargo > 0) {
      const n = state.cargo;
      state.cargoBanked += n;
      state.cargo = 0;
      log(`The dockhands haul ${n} crate${n > 1 ? 's' : ''} of salvage ashore. The ledger grows: ${state.cargoBanked} banked.`, '', 'PORT');
      sfx('bell');
    }
    if (atPort && state.relics > 0) {
      state.relicsBanked += state.relics;
      log(`${state.relics} relic${state.relics > 1 ? 's' : ''} go ashore under guard. The collectors will pay well, someday. ${state.relicsBanked} in the vault.`, 'strange', 'PORT');
      state.relics = 0;
      sfx('relic');
    }
    // The yard: banked crates buy hull patching (prices in DOCK_PRICES).
    // Spends only what the damage needs, never more.
    if (atPort && state.hull < sub.hull && state.cargoBanked > 0) {
      const need = Math.ceil((sub.hull - state.hull) / DOCK_PRICES.hullPerCrate);
      const spend = Math.min(need, state.cargoBanked);
      const gained = Math.min(sub.hull - state.hull, spend * DOCK_PRICES.hullPerCrate);
      state.cargoBanked -= spend;
      state.hull += gained;
      log(`The yard works the hull: ${spend} crate${spend > 1 ? 's' : ''} buys +${gained} hull. ${state.cargoBanked} banked.`, '', 'YARD');
    }
    // The outfitter: the next boat up the ladder, offered when affordable.
    // One-button commerce — the port makes the offer; a second hatch-press
    // within the window accepts. Moving away lets the offer lapse.
    if (atPort) {
      const next = Object.keys(SUBS).map(k => SUBS[k].tier === sub.tier + 1 ? k : null).filter(Boolean)[0];
      const offer = state._outfitOffer;
      if (offer && offer.key && SUBS[offer.key]
          && offer.q === state.q && offer.r === state.r
          && performance.now() < offer.until
          && state.cargoBanked >= SUBS[offer.key].price) {
        const bought = SUBS[offer.key];
        state.cargoBanked -= bought.price;
        activeSubKey = offer.key;
        state.hull = bought.hull;
        state.air = bought.air;
        state._outfitOffer = null;
        const pp2 = document.getElementById('ping-power');
        if (pp2) pp2.max = bought.sonarMaxPower;
        log(`The ${bought.name} takes the water. ${bought.description} (${bought.price} crates; ${state.cargoBanked} banked.)`, '', 'OUTFIT');
        sfx('bell');
        updateHUD();
        render();
        return;
      }
      if (next && state.cargoBanked >= SUBS[next].price) {
        state._outfitOffer = { key: next, q: state.q, r: state.r, until: performance.now() + 45000 };
        log(`The outfitter's shed is open: the ${SUBS[next].name} lies ready — ${SUBS[next].price} crates. Press Surface again to take her.`, 'warn', 'OUTFIT');
      }
    }
    if (state.air >= sub.air) {
      log('Already at full air. The hatch is sealed; the boat waits.', 'warn');
      return;
    }
    state.air = sub.air;
    log(`Hatch open. Air reserves restored.`, '', 'SURFACE');
    updateHUD();
    render();
    return;
  }

  // Otherwise, rise within the current volume — ascend toward its ceiling.
  const vol = volumeContaining(tile, state.currentDepth);
  if (!vol) {
    log('No volume here to rise within.', 'warn');
    return;
  }
  if (state.currentDepth > vol.ceiling) {
    const delta = state.currentDepth - vol.ceiling;
    changeDepth(-Math.min(delta, sub.diveStepFast));
  } else {
    log('Already at the top of this space.', 'warn');
  }
}

//=============================================================================
// PERSISTENCE — the substrate/overlay split made real.
//
// The WORLD is never saved: it is a pure function of worldSeed, recomputed
// cell-for-cell identical on every load. What's saved is the OVERLAY — the
// seed itself plus everything the player has done: position, resources, and
// which cells of the dark they have charted. This is the exact split a shared
// multiplayer sea needs (server ships a seed + deltas), running locally.
//=============================================================================

const SAVE_KEY = 'fathom-save-v1';
let gameStarted = false;
let saveTimer = 0;

function scheduleSave() {
  if (saveTimer || !gameStarted) return;
  saveTimer = setTimeout(doSave, 400);
}

function doSave() {
  saveTimer = 0;
  if (!gameStarted || !state.alive) return;
  try {
    const rev = {};
    for (const [k, s] of revealed) rev[k] = [...s];
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 2, seed: worldSeed,
      q: state.q, r: state.r, depth: state.currentDepth,
      air: state.air, hull: state.hull, maxDepth: state.maxDepth,
      moves: state.moves, poisFound: state.poisFound,
      lastZone: state.lastZone, maxZoneReached: state.maxZoneReached,
      visited: [...visited], revealed: rev,
      creatures: state.creatures, spawnedChunks: [...spawnedChunks],
      cargo: state.cargo, cargoBanked: state.cargoBanked,
      relics: state.relics, relicsBanked: state.relicsBanked,
      expedition: state.expedition,
      subKey: activeSubKey,
    }));
  } catch (e) { /* quota or private mode — persistence is best-effort */ }
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (!p || (p.v !== 1 && p.v !== 2) || typeof p.seed !== 'number') return null;
    return p;
  } catch (e) { return null; }
}

function clearSave() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = 0; }
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

// Rebuild the saved run: same seed → the identical infinite world regenerates
// beneath the boat; the overlay puts the player, their charts, and their
// resources back exactly where they were.
function resumeGame(save) {
  activeSubKey = SUBS[save.subKey] ? save.subKey : 'erebus';
  state._outfitOffer = null;
  const sub = activeSub();
  state.q = save.q; state.r = save.r;
  state.air = save.air; state.hull = save.hull;
  state.currentDepth = save.depth; state.maxDepth = save.maxDepth || 0;
  state.moves = save.moves || 0; state.poisFound = save.poisFound || [];
  state.alive = true;
  state.panX = 0; state.panY = 0;
  state.trail = []; state.failHex = null;
  state.ping = null; state.pingArrows = null;
  state.pingMemory = new Map();
  world.clear(); cells.clear(); revealed.clear(); visited.clear();
  generatedChunks.clear(); nodeCache.clear(); edgeCache.clear(); carvedFeatures.clear();
  // Creatures + spawn history restore BEFORE generation, so already-rolled
  // chunks don't re-roll their inhabitants into duplicates.
  spawnedChunks.clear();
  for (const ck of save.spawnedChunks || []) spawnedChunks.add(ck);
  state.creatures = save.creatures || [];
  state.cargo = save.cargo || 0;
  state.cargoBanked = save.cargoBanked || 0;
  state.relics = save.relics || 0;
  state.relicsBanked = save.relicsBanked || 0;
  state.expedition = save.expedition || null;
  worldSeed = save.seed;
  // Gameplay dice only — the substrate derives everything from hashed seeds.
  rng = mulberry32((worldSeed ^ Date.now()) >>> 0);
  tileAt(0, 0);                 // origin (dock, pier entrance) always exists
  tileAt(state.q, state.r);     // and the water under the boat
  for (const k of save.visited || []) visited.add(k);
  const rev = save.revealed || {};
  for (const k in rev) revealed.set(k, new Set(rev[k]));
  const px = hexToPixel(state.q, state.r);
  state.cameraX = px.x; state.cameraY = px.y;
  state.lastZone = save.lastZone || 'shelf';
  state.maxZoneReached = save.maxZoneReached || 0;
  logEl.innerHTML = '';
  const depthNote = state.currentDepth > 0 ? `, ${Math.round(state.currentDepth)} m down` : ', riding the surface';
  log(`The chart unrolls where you left it. The ${sub.name} holds station${depthNote}.`, '', 'RESUME');
  document.getElementById('gameover').classList.remove('show');
  const pp = document.getElementById('ping-power');
  if (pp) pp.max = sub.sonarMaxPower;
  gameStarted = true;
  updatePingDisplay();
  updateHUD();
  render();
  schedulePregen();
}

//=============================================================================
// DRAG-TO-PAN + PINCH-ZOOM + WHEEL-ZOOM
//=============================================================================
const ZOOM_MIN = 0.6;
const ZOOM_MAX = 5.0;
// Set zoom and update the viewBox immediately. Full re-render is optional —
// during a pinch we want to *only* update the viewBox (cheap, browser scales
// existing SVG) and skip the expensive DOM rebuild until the gesture ends.
function setZoom(newZoom, opts) {
  zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
  // Always update the viewBox so the visual zoom is immediate.
  const rect = document.getElementById('chart-container').getBoundingClientRect();
  viewW = rect.width;
  viewH = rect.height;
  const vw = viewW / zoom;
  const vh = viewH / zoom;
  svg.setAttribute('viewBox', `${-vw/2} ${-vh/2} ${vw} ${vh}`);
  svg.setAttribute('width', viewW);
  svg.setAttribute('height', viewH);
  if (!(opts && opts.skipRender)) render();
}

(function() {
  // Modes: idle | dragging | pinching
  let mode = 'idle';
  let dragStartX = 0, dragStartY = 0;
  let originPanX = 0, originPanY = 0;
  let totalMove = 0;
  const TAP_THRESH = 8; // pixels

  // Pinch tracking
  let pinchStartDist = 0;
  let pinchStartZoom = 0;
  // rAF coalescing for zoom updates during pinch
  let pendingZoom = null;
  let rafId = 0;
  // rAF coalescing for pan updates during drag
  let panRafId = 0;
  let panDirty = false;

  function touchDist(t1, t2) {
    const dx = t2.clientX - t1.clientX;
    const dy = t2.clientY - t1.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function flushZoom() {
    rafId = 0;
    if (pendingZoom == null) return;
    // viewBox-only update during the gesture — no DOM rebuild
    setZoom(pendingZoom, { skipRender: true });
    pendingZoom = null;
  }

  function queueZoom(z) {
    pendingZoom = z;
    if (!rafId) rafId = requestAnimationFrame(flushZoom);
  }

  // Cheap pan: just retranslate the existing world group. The whole hex tree
  // and labels move together without rebuilding anything.
  function flushPan() {
    panRafId = 0;
    if (!worldGroupEl) return;
    // Recompute the camera the same way render does — but apply only to the
    // existing group's transform, no DOM rebuild.
    const playerPx = hexToPixel(state.q, state.r);
    state.cameraX += (playerPx.x - state.cameraX) * 0.3;
    state.cameraY += (playerPx.y - state.cameraY) * 0.3;
    const camX = state.cameraX + state.panX;
    const camY = state.cameraY + state.panY;
    lastCamX = camX; lastCamY = camY;
    worldGroupEl.setAttribute('transform', `translate(${-camX}, ${-camY})`);
  }

  function queuePan() {
    if (!panRafId) panRafId = requestAnimationFrame(flushPan);
  }

  function startDrag(clientX, clientY) {
    mode = 'dragging';
    dragStartX = clientX; dragStartY = clientY;
    originPanX = state.panX; originPanY = state.panY;
    totalMove = 0;
  }

  function startPinch(t1, t2) {
    mode = 'pinching';
    pinchStartDist = touchDist(t1, t2);
    pinchStartZoom = zoom;
    totalMove = 999; // ensure subsequent tap is suppressed
  }

  function pointerDown(e) {
    if (e.touches && e.touches.length >= 2) {
      startPinch(e.touches[0], e.touches[1]);
      if (e.cancelable) e.preventDefault();
      return;
    }
    const p = (e.touches && e.touches[0]) || e;
    startDrag(p.clientX, p.clientY);
  }

  function pointerMove(e) {
    // Pinch takes priority — if we have two touches, do pinch regardless of mode
    if (e.touches && e.touches.length >= 2) {
      if (mode !== 'pinching') startPinch(e.touches[0], e.touches[1]);
      const d = touchDist(e.touches[0], e.touches[1]);
      if (pinchStartDist > 0) {
        queueZoom(pinchStartZoom * (d / pinchStartDist));
      }
      if (e.cancelable) e.preventDefault();
      return;
    }
    if (mode !== 'dragging') return;
    const p = (e.touches && e.touches[0]) || e;
    const dx = p.clientX - dragStartX;
    const dy = p.clientY - dragStartY;
    totalMove = Math.max(totalMove, Math.abs(dx) + Math.abs(dy));
    if (totalMove > TAP_THRESH) {
      state.panX = originPanX - dx / zoom;
      state.panY = originPanY - dy / zoom;
      // Cheap pan: update the world group's transform attribute only.
      // Coalesced to one update per animation frame.
      queuePan();
      panDirty = true;
      if (e.cancelable) e.preventDefault();
    }
  }

  function pointerUp(e) {
    // Flush any pending zoom and do one full render so hit targets etc.
    // resize correctly for the final zoom.
    if (mode === 'pinching') {
      if (pendingZoom != null) {
        setZoom(pendingZoom, { skipRender: true });
        pendingZoom = null;
      }
      render();
    }
    // After a drag, do one full render so any hex that panned in from
    // beyond the previously-visible area gets drawn for the new viewport.
    if (mode === 'dragging' && panDirty) {
      panDirty = false;
      render();
    }
    // If a finger lifted but one remains, continue as drag with the remaining finger
    if (e.touches && e.touches.length === 1 && mode === 'pinching') {
      const p = e.touches[0];
      startDrag(p.clientX, p.clientY);
      return;
    }
    if (e.touches && e.touches.length === 0) {
      mode = 'idle';
    } else if (!e.touches) {
      mode = 'idle';
    }
  }

  const surfaceEl = document.getElementById('chart-svg');
  surfaceEl.addEventListener('mousedown', pointerDown);
  surfaceEl.addEventListener('mousemove', pointerMove);
  surfaceEl.addEventListener('mouseup', pointerUp);
  surfaceEl.addEventListener('mouseleave', pointerUp);
  surfaceEl.addEventListener('touchstart', pointerDown, {passive: false});
  surfaceEl.addEventListener('touchmove', pointerMove, {passive: false});
  surfaceEl.addEventListener('touchend', pointerUp);
  surfaceEl.addEventListener('touchcancel', pointerUp);

  // Wheel zoom on desktop. Same trick — viewBox-only during the wheel burst,
  // then a final render after a short idle.
  let wheelIdle = 0;
  surfaceEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0015);
    setZoom(zoom * factor, { skipRender: true });
    clearTimeout(wheelIdle);
    wheelIdle = setTimeout(() => render(), 120);
  }, {passive: false});

  // Suppress hex tap if a drag/pinch actually happened.
  surfaceEl.addEventListener('click', (e) => {
    if (totalMove > TAP_THRESH) { e.stopPropagation(); e.preventDefault(); totalMove = 0; }
  }, true);
})();

//=============================================================================
// DEPTH STRIP UPDATER
//=============================================================================
function updateDepthStrip() {
  const sub = activeSub();
  const marker = document.getElementById('depth-strip-marker');
  const hexRange = document.getElementById('depth-strip-hex-range');
  const safeLine = document.getElementById('depth-strip-safe-line');
  const crushLine = document.getElementById('depth-strip-crush-line');
  if (!marker) return;

  // Strip represents 0 to maxScale meters, where maxScale extends past crush depth.
  const maxScale = Math.max(sub.crushDepth * 1.2, state.maxDepth * 1.1, 1000);

  function pct(m) { return (Math.max(0, Math.min(maxScale, m)) / maxScale) * 100; }

  const tile = getTile(state.q, state.r);
  // The sounder reads the contiguous run the sub is in (first echo) — not the
  // hex's full column, which may hide runs sealed behind unexplored stone.
  const curRun = tile && !tile.wall ? volumeContaining(tile, state.currentDepth) : null;
  if (curRun) {
    const top = pct(curRun.ceiling);
    const bot = pct(curRun.floor);
    hexRange.style.top = top + '%';
    hexRange.style.height = (bot - top) + '%';
  }
  safeLine.style.top = pct(sub.safeDepth) + '%';
  crushLine.style.top = pct(sub.crushDepth) + '%';
  marker.style.top = `calc(${pct(state.currentDepth)}% - 2px)`;

  const r = document.getElementById('dive-depth-readout');
  if (r) r.textContent = Math.round(state.currentDepth) + ' m';
}

window.addEventListener('resize', () => { setViewport(); render(); });

// Prevent pinch zoom on iOS
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());

// Initialize viewport early in case title is skipped
setViewport();
</script>
