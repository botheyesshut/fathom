<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#040810">
<title>Fathom — The Chart</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap');

  :root {
    --void: #040810;
    --abyss: #081420;
    --stone: #2a2118;
    --stone-lit: #3d2f20;
    --water: #0e2840;
    --sonar: #5eb89a;
    --sonar-dim: #2a5a4a;
    --sonar-faint: #16302a;
    --lantern: #f4b860;
    --lantern-warm: #d89248;
    --blood: #a04030;
    --bone: #e8dcc4;
    --bone-dim: #8a7d68;
    --strange: #b870e8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--void);
    color: var(--bone);
    font-family: 'Cormorant Garamond', serif;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    position: fixed;
    inset: 0;
  }

  /* ====== TITLE SCREEN ====== */
  #title {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(94, 184, 154, 0.08), transparent 60%),
      radial-gradient(ellipse at 50% 70%, rgba(244, 184, 96, 0.04), transparent 50%),
      var(--void);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 2rem;
    transition: opacity 1.2s ease;
  }

  #title.gone { opacity: 0; pointer-events: none; }

  #title h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(3.5rem, 18vw, 6rem);
    letter-spacing: 0.18em;
    color: var(--bone);
    text-shadow: 0 0 40px rgba(94, 184, 154, 0.3);
    margin-bottom: 0.4rem;
    animation: breathe 6s ease-in-out infinite;
  }

  #title .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--sonar);
    opacity: 0.7;
    margin-bottom: 4rem;
  }

  #title .epigraph {
    font-style: italic;
    font-size: 1.05rem;
    color: var(--bone-dim);
    text-align: center;
    max-width: 22rem;
    line-height: 1.6;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeIn 2s ease 0.8s forwards;
  }

  #title .epigraph .attr {
    display: block;
    margin-top: 0.6rem;
    font-style: normal;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--sonar-dim);
  }

  #title button {
    background: transparent;
    border: 1px solid var(--sonar-dim);
    color: var(--sonar);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 1rem 2.5rem;
    cursor: pointer;
    transition: all 0.4s ease;
    opacity: 0;
    animation: fadeIn 1.2s ease 0.4s forwards;
    touch-action: manipulation;
  }

  #title button:active {
    background: rgba(94, 184, 154, 0.1);
    border-color: var(--sonar);
    box-shadow: 0 0 30px rgba(94, 184, 154, 0.3);
  }

  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 40px rgba(94, 184, 154, 0.3); }
    50% { text-shadow: 0 0 60px rgba(94, 184, 154, 0.5), 0 0 100px rgba(94, 184, 154, 0.2); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* ====== HUD ====== */
  #hud {
    position: relative;
    z-index: 10;
    padding: 0.8rem 1rem 0.6rem;
    background: linear-gradient(180deg, var(--void) 0%, rgba(4,8,16,0.85) 80%, transparent 100%);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.8rem;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    flex: 1;
  }

  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--bone-dim);
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--bone);
    letter-spacing: 0.08em;
  }

  .stat-value.warn { color: var(--lantern); }
  .stat-value.danger { color: var(--blood); animation: pulse-danger 1s ease-in-out infinite; }

  @keyframes pulse-danger {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .bar {
    height: 2px;
    background: var(--abyss);
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    background: var(--sonar);
    transition: width 0.6s ease, background 0.3s ease;
  }

  .bar-fill.warn { background: var(--lantern); }
  .bar-fill.danger { background: var(--blood); }

  /* ====== CHART ====== */
  #chart-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000000;
    touch-action: none;
  }

  #chart-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: grab;
  }

  #chart-svg:active { cursor: grabbing; }

  /* ====== DEPTH STRIP ====== */
  #depth-strip {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    bottom: 0.6rem;
    width: 28px;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    pointer-events: none;
    z-index: 5;
  }
  #depth-strip-track {
    flex: 1;
    position: relative;
    background: linear-gradient(180deg, rgba(94,184,154,0.05) 0%, rgba(94,184,154,0.02) 30%, rgba(160,64,48,0.04) 100%);
    border-left: 1px solid rgba(94,184,154,0.25);
    border-right: 1px solid rgba(94,184,154,0.25);
  }
  #depth-strip-hex-range {
    position: absolute;
    left: 0;
    right: 0;
    background: rgba(94,184,154,0.18);
    border-top: 1px solid rgba(94,184,154,0.5);
    border-bottom: 1px solid rgba(94,184,154,0.5);
  }
  #depth-strip-safe-line {
    position: absolute;
    left: -3px;
    right: -3px;
    height: 0;
    border-top: 1px dashed rgba(244,184,96,0.6);
  }
  #depth-strip-crush-line {
    position: absolute;
    left: -3px;
    right: -3px;
    height: 0;
    border-top: 1px dashed rgba(160,64,48,0.8);
  }
  #depth-strip-marker {
    position: absolute;
    left: -4px;
    right: -4px;
    height: 4px;
    background: var(--lantern);
    box-shadow: 0 0 8px var(--lantern);
    border-radius: 1px;
    transition: top 0.3s ease;
  }
  #depth-strip-labels {
    display: none; /* hide for now to keep strip clean */
  }

  /* ====== RECENTER BUTTON ====== */
  #recenter-btn {
    position: absolute;
    bottom: 0.6rem;
    right: 3rem; /* clear of the depth strip on the right */
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--sonar-dim);
    background: rgba(8, 20, 32, 0.7);
    color: var(--sonar);
    font-size: 1.1rem;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    backdrop-filter: blur(4px);
    transition: all 0.2s ease;
  }
  #recenter-btn:active {
    background: rgba(94,184,154,0.2);
    border-color: var(--sonar);
    transform: scale(0.92);
  }

  /* ====== DIVE CONTROLS ====== */
  #dive-controls {
    display: flex;
    gap: 0.35rem;
    align-items: center;
    justify-content: center;
  }
  .dive-btn {
    flex: 0 1 auto !important;
    min-width: 38px;
    padding: 0.6rem 0.4rem !important;
    font-size: 0.7rem !important;
  }
  #dive-depth-readout {
    flex: 1;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    color: var(--lantern);
  }

  /* sonar pulse animation */
  .sonar-pulse {
    transform-origin: center;
    animation: sonar-ping 3s ease-out infinite;
    pointer-events: none;
  }

  @keyframes sonar-ping {
    0% { transform: scale(0.1); opacity: 0.6; }
    100% { transform: scale(4); opacity: 0; }
  }

  /* tile fade-in when revealed */
  @keyframes reveal {
    from { opacity: 0; transform: scale(0.6); }
    to { opacity: 1; transform: scale(1); }
  }

  .hex.revealed {
    animation: reveal 0.5s ease-out backwards;
    transform-origin: center;
    transform-box: fill-box;
  }

  /* Player arrival pulse */
  @keyframes arrive {
    0% { transform: scale(0.4); opacity: 0; }
    50% { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .arrival {
    animation: arrive 0.4s ease-out;
    transform-origin: center;
    transform-box: fill-box;
  }

  /* Failed-move flash on destination hex */
  @keyframes flash-fail {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    100% { opacity: 0; }
  }
  .move-flash {
    animation: flash-fail 0.55s ease-out;
    pointer-events: none;
  }

  /* Sub shake — used to confirm input was received on a failed move */
  @keyframes sub-shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-1.2px, 0.6px); }
    40% { transform: translate(1.4px, -0.4px); }
    60% { transform: translate(-0.8px, 0.5px); }
    80% { transform: translate(0.6px, -0.5px); }
  }
  .sub-shake {
    animation: sub-shake 0.35s ease-out;
    transform-origin: center;
    transform-box: fill-box;
  }

  /* ====== SOUND TOGGLE ====== */
  #sound-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 20;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--sonar-dim);
    background: rgba(4, 8, 16, 0.7);
    color: var(--sonar);
    font-size: 1rem;
    line-height: 1;
  }
  #sound-btn.muted { opacity: 0.35; }

  /* ====== LOG / MESSAGES ====== */
  #log {
    position: relative;
    z-index: 10;
    padding: 0.75rem 1rem 1rem;
    background: linear-gradient(0deg, var(--void) 0%, rgba(4,8,16,0.85) 80%, transparent 100%);
    min-height: 6rem;
    max-height: 6rem;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .log-entry {
    font-size: 1.15rem;
    line-height: 1.4;
    color: var(--bone);
    font-style: italic;
    animation: log-in 0.4s ease-out;
    margin-bottom: 0.3rem;
  }

  .log-entry.old { color: var(--bone-dim); opacity: 0.55; font-size: 1rem; }

  .log-entry .echo {
    font-family: 'JetBrains Mono', monospace;
    font-style: normal;
    font-size: 0.78rem;
    color: var(--sonar);
    letter-spacing: 0.22em;
    margin-right: 0.55rem;
    text-transform: uppercase;
  }

  .log-entry .echo.strange { color: var(--strange); }
  .log-entry .echo.warn { color: var(--lantern); }
  .log-entry .echo.danger { color: var(--blood); }

  @keyframes log-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ====== CONTROLS ====== */
  #controls {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding: 0 1rem 1.2rem;
    flex-shrink: 0;
  }

  #ping-power-row {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--sonar-dim);
    border-radius: 2px;
    background: rgba(94, 184, 154, 0.03);
  }

  .ping-info {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .ping-label {
    color: var(--bone-dim);
  }

  .ping-stats {
    color: var(--sonar);
    letter-spacing: 0.15em;
  }

  #ping-power {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 24px;
    background: transparent;
    cursor: pointer;
    margin: 0;
    padding: 0;
  }

  #ping-power::-webkit-slider-runnable-track {
    height: 2px;
    background: linear-gradient(to right, var(--sonar-faint), var(--sonar));
    border-radius: 1px;
  }

  #ping-power::-moz-range-track {
    height: 2px;
    background: linear-gradient(to right, var(--sonar-faint), var(--sonar));
    border-radius: 1px;
  }

  #ping-power::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--sonar);
    border: 2px solid var(--void);
    box-shadow: 0 0 8px var(--sonar);
    margin-top: -7px;
    cursor: pointer;
  }

  #ping-power::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--sonar);
    border: 2px solid var(--void);
    box-shadow: 0 0 8px var(--sonar);
    cursor: pointer;
  }

  #controls-row {
    display: flex;
    gap: 0.5rem;
  }

  .btn {
    flex: 1;
    background: transparent;
    border: 1px solid var(--sonar-dim);
    color: var(--sonar);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.9rem 0.5rem;
    cursor: pointer;
    transition: all 0.2s ease;
    border-radius: 2px;
  }

  .btn:active {
    background: rgba(94, 184, 154, 0.15);
    border-color: var(--sonar);
    transform: scale(0.97);
  }

  .btn.primary {
    border-color: var(--lantern-warm);
    color: var(--lantern);
  }

  .btn.primary:active {
    background: rgba(244, 184, 96, 0.15);
    border-color: var(--lantern);
  }

  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ====== GAME OVER ====== */
  #gameover {
    position: fixed;
    inset: 0;
    background: rgba(4, 8, 16, 0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 2rem;
    backdrop-filter: blur(8px);
  }

  #gameover.show { display: flex; }

  #gameover h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 2.5rem;
    color: var(--blood);
    margin-bottom: 1rem;
    letter-spacing: 0.08em;
  }

  #gameover .summary {
    font-style: italic;
    color: var(--bone-dim);
    text-align: center;
    max-width: 20rem;
    margin-bottom: 0.5rem;
    line-height: 1.5;
  }

  #gameover .stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--sonar);
    letter-spacing: 0.2em;
    margin: 1.5rem 0 2rem;
    text-align: center;
    line-height: 2;
  }
</style>
</head>
<body>

<!-- TITLE SCREEN -->
<div id="title">
  <h1>Fathom</h1>
  <div class="sub">The Chart · Prototype</div>
  <div class="epigraph">
    There is no map of these waters. The Chart you carry was drawn by drowned men, and they were not careful.
    <span class="attr">— Logbook of the Vessel Erebus, recovered</span>
  </div>
  <button id="dive">Dive</button>
</div>

<!-- GAME OVER -->
<div id="gameover">
  <h2 id="go-title">The deep has you.</h2>
  <p class="summary" id="go-summary"></p>
  <div class="stats" id="go-stats"></div>
  <button class="btn primary" id="go-restart">Surface and try again</button>
</div>

<!-- HUD -->
<div id="hud">
  <div class="stat-row">
    <div class="stat">
      <div class="stat-label">Air</div>
      <div class="stat-value" id="air-val">350</div>
      <div class="bar"><div class="bar-fill" id="air-bar" style="width:100%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Hull</div>
      <div class="stat-value" id="hull-val">100</div>
      <div class="bar"><div class="bar-fill" id="hull-bar" style="width:100%"></div></div>
    </div>
    <div class="stat">
      <div class="stat-label">Depth</div>
      <div class="stat-value" id="depth-val">0</div>
      <div class="bar"><div class="bar-fill" id="depth-bar" style="width:0%; background: var(--strange);"></div></div>
    </div>
  </div>
</div>

<!-- CHART -->
<div id="chart-container">
  <svg id="chart-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
  <!-- Vertical depth strip overlay -->
  <div id="depth-strip">
    <div id="depth-strip-track">
      <div id="depth-strip-hex-range"></div>
      <div id="depth-strip-safe-line"></div>
      <div id="depth-strip-crush-line"></div>
      <div id="depth-strip-marker"></div>
    </div>
    <div id="depth-strip-labels">
      <span class="depth-strip-label" id="depth-strip-top">0</span>
      <span class="depth-strip-label" id="depth-strip-bot">800</span>
    </div>
  </div>
  <!-- Recenter button overlay -->
  <button id="recenter-btn" title="Center on sub">⊕</button>
  <!-- Sound toggle overlay -->
  <button id="sound-btn" title="Sound on/off">♪</button>
</div>

<!-- LOG -->
<div id="log"></div>

<!-- CONTROLS -->
<div id="controls">
  <div id="ping-power-row">
    <div class="ping-info">
      <span class="ping-label">Sonar Power</span>
      <span class="ping-stats"><span id="ping-cost">5</span> air · <span id="ping-range">300</span> m</span>
    </div>
    <input type="range" id="ping-power" min="0" max="5" value="2" step="1">
  </div>
  <div id="dive-controls">
    <button class="btn dive-btn" id="btn-ascend-fast" title="Ascend 120 m">▲▲</button>
    <button class="btn dive-btn" id="btn-ascend">▲</button>
    <span id="dive-depth-readout">0 m</span>
    <button class="btn dive-btn" id="btn-descend">▼</button>
    <button class="btn dive-btn" id="btn-descend-fast" title="Descend 120 m">▼▼</button>
  </div>
  <div id="controls-row">
    <button class="btn" id="btn-ping">Ping</button>
    <button class="btn primary" id="btn-surface">Surface</button>
    <button class="btn" id="btn-newworld" title="Abandon this ocean and chart another">New World</button>
  </div>
</div>

<script>
//=============================================================================
// FATHOM — The Chart
// Phase 1 prototype: feel of frontier exploration on a phone screen.
//=============================================================================

const HEX_SIZE = 16; // smaller so we see a wider expanse of the labyrinth
const SQRT3 = Math.sqrt(3);

// Hex math (pointy-top, axial coordinates q,r)
function hexToPixel(q, r) {
  return {
    x: HEX_SIZE * SQRT3 * (q + r/2),
    y: HEX_SIZE * 1.5 * r
  };
}
// Inverse of hexToPixel — converts a pixel position back to fractional axial
// coords, then rounds to the nearest hex. Used by render() to find which hex
// the camera is centered on.
function pixelToHex(x, y) {
  const r = y / (HEX_SIZE * 1.5);
  const q = x / (HEX_SIZE * SQRT3) - r / 2;
  // Cube-coordinate rounding for accurate nearest-hex
  const s = -q - r;
  let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
  const qd = Math.abs(rq - q), rd = Math.abs(rr - r), sd = Math.abs(rs - s);
  if (qd > rd && qd > sd) rq = -rr - rs;
  else if (rd > sd)       rr = -rq - rs;
  return { q: rq, r: rr };
}
function hexDistance(a, b) {
  return (Math.abs(a.q - b.q) + Math.abs(a.q + a.r - b.q - b.r) + Math.abs(a.r - b.r)) / 2;
}
function hexNeighbors(q, r) {
  return [
    {q: q+1, r: r},   {q: q+1, r: r-1},
    {q: q,   r: r-1}, {q: q-1, r: r},
    {q: q-1, r: r+1}, {q: q,   r: r+1}
  ];
}
function hexKey(q, r) { return q + ',' + r; }
// Cell model (voxel): the world's emerging source of truth is a sparse grid
// keyed by hex + depth. An absent key means solid stone. Each 60-m depth slice
// of a hex is its own cell — no column-wide inheritance, no "impassable water".
function cellKey(q, r, d) { return q + ',' + r + ',' + d; }

// Hex corners for an SVG polygon (pointy-top)
function hexCorners(cx, cy, size) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    pts.push((cx + size * Math.cos(a)).toFixed(2) + ',' + (cy + size * Math.sin(a)).toFixed(2));
  }
  return pts.join(' ');
}
function hexCornerPoint(cx, cy, size, i) {
  const a = Math.PI / 180 * (60 * i - 30);
  return { x: cx + size * Math.cos(a), y: cy + size * Math.sin(a) };
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let worldSeed = Date.now() & 0xffffffff;
let rng = mulberry32(worldSeed);
function rand() { return rng(); }
function randInt(n) { return Math.floor(rand() * n); }
function pick(arr) { return arr[randInt(arr.length)]; }
function chance(p) { return rand() < p; }

const world = new Map();
const cells = new Map(); // cellKey(q,r,depth) → { type, kind }. Absent = stone. The voxel source of truth.
const carvedFeatures = new Set(); // 'c:'/'e:'/'s:' + feature id — each cave feature carves exactly once
const spawnedChunks = new Set(); // chunks that already rolled their creatures — overlay state, saved
const revealed = new Map(); // hexKey → Set<depth> — tracks which depths each tile was revealed at
const visited = new Set();
const generatedChunks = new Set();

// Depth bands for the cave network. Marianas Trench (~11,000 meters) is the
// effective hard floor. Each band is a sprawling region — comparable in size
// and complexity to a full hand-drawn dungeon map per band, with seven such
// bands stacked vertically and interconnected. The player will not exhaust
// any one of them in any reasonable session; that's the point.
// density = probability that a given lattice cell in this band holds a
// chamber — denser near the surface, sparser and lonelier in the deep. Tuned
// to match the original hand-built world's areal density near the origin;
// every value is a feel knob.
const CAVE_BANDS = [
  { id: 'b0', minDepth:  480, maxDepth:  720,   density: 0.83 },
  { id: 'b1', minDepth:  900, maxDepth: 1320,   density: 0.75 },
  { id: 'b2', minDepth: 1620, maxDepth: 2160,   density: 0.67 },
  { id: 'b3', minDepth: 2580, maxDepth: 3600,   density: 0.57 },
  { id: 'b4', minDepth: 4200, maxDepth: 5640,   density: 0.47 },
  { id: 'b5', minDepth: 6480, maxDepth: 8520,   density: 0.36 },
  { id: 'b6', minDepth: 9480, maxDepth: 10800,  density: 0.34 },
];

// ---- Infinite cave generation (Stage E) ---------------------------------
// Chambers are placed on a coarse lattice: space is divided into NODE_CELL-hex
// square cells, and each (cell, band) deterministically spawns 0 or 1 chamber
// via a hash of (seed, band, cellQ, cellR). This makes the chamber graph
// infinite and LOCALLY computable — any region's chambers are found by
// iterating the cells overlapping it, with no global list. Mirrors how the
// ocean (shelfSeafloorDepth) is already a pure function of position.
const NODE_CELL = 12; // hexes per node-cell side
// Substrate feature-content rates — deterministic hash rolls (see the tail of
// carveChamber and the shelf-feature pass in generateChunk). Feel knobs.
const CAVE_POI_CHANCE = 0.40;      // chance a chamber holds a point of interest
const SHELF_KELP_ROLL = 0.0026;    // per shelf hex: roll under this → kelp...
const SHELF_SALVAGE_ROLL = 0.0013; // ...but under this → a wreck instead

// Longest a tunnel may run, in hexes. THIS is what makes the world locally
// computable: a chunk only has to consider chambers within this reach to know
// every tunnel that could cross it. Meandering adds a little slack on top.
const MAX_TUNNEL = 40;
const BEND_MARGIN = 10;
// How far around a chamber we look for neighbours (and for chambers a tunnel
// might pierce). Fixed, so caveEdgesForNode is a pure function of the node —
// two different chunks computing the same chamber get the same tunnels.
const CONNECT_SCAN = MAX_TUNNEL + 16;
const Z_TUNNEL_CHANCE = 0.15;  // chance a chamber drops a shaft to the band below
const SINKHOLE_CHANCE = 0.35;  // chance a top-band chamber opens to daylight

// Memoised lattice lookups. Chunk generation queries heavily-overlapping
// regions, so without this the same cells get recomputed thousands of times.
const nodeCache = new Map();
function caveNodeAt(ncq, ncr, bandIdx) {
  const ck = bandIdx + ':' + ncq + ':' + ncr;
  if (nodeCache.has(ck)) return nodeCache.get(ck);
  const node = caveNodeCompute(ncq, ncr, bandIdx);
  nodeCache.set(ck, node);
  return node;
}

// The chamber for a given lattice cell + band, or null if the cell is empty.
// Fully deterministic in (worldSeed, band, ncq, ncr).
function caveNodeCompute(ncq, ncr, bandIdx) {
  const band = CAVE_BANDS[bandIdx];
  const rng = mulberry32(hashStr(worldSeed + ':' + band.id + ':' + ncq + ':' + ncr));
  if (rng() >= band.density) return null; // this cell holds no chamber
  const q = ncq * NODE_CELL + Math.floor(rng() * NODE_CELL);
  const r = ncr * NODE_CELL + Math.floor(rng() * NODE_CELL);
  const depth = snapToGrid(band.minDepth + rng() * (band.maxDepth - band.minDepth));
  const sizeRoll = rng();
  let chamberRadius, chamberKind;
  if (sizeRoll < 0.03)      { chamberRadius = 9 + rng() * 6;   chamberKind = 'grand'; }
  else if (sizeRoll < 0.15) { chamberRadius = 5 + rng() * 3;   chamberKind = 'cavern'; }
  else if (sizeRoll < 0.55) { chamberRadius = 2.5 + rng() * 2; chamberKind = 'chamber'; }
  else                      { chamberRadius = 1 + rng() * 1.5; chamberKind = 'antechamber'; }
  return { id: band.id + ':' + ncq + ':' + ncr, q, r, depth, chamberRadius, chamberKind, bandId: band.id, bandIdx };
}

// Every chamber whose center lattice-cell overlaps the hex box [qMin,qMax] x
// [rMin,rMax], across all bands. Bounded, order-independent, deterministic.
function caveNodesInRegion(qMin, qMax, rMin, rMax) {
  const out = [];
  const ncq0 = Math.floor(qMin / NODE_CELL), ncq1 = Math.floor(qMax / NODE_CELL);
  const ncr0 = Math.floor(rMin / NODE_CELL), ncr1 = Math.floor(rMax / NODE_CELL);
  for (let bi = 0; bi < CAVE_BANDS.length; bi++) {
    for (let ncq = ncq0; ncq <= ncq1; ncq++) {
      for (let ncr = ncr0; ncr <= ncr1; ncr++) {
        const node = caveNodeAt(ncq, ncr, bi);
        if (node) out.push(node);
      }
    }
  }
  return out;
}

// Canonical edge id — same string whichever endpoint asks.
function caveEdgeId(a, b) { return a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id; }

// Tunnel width from endpoint chamber sizes. Hash-derived so it's a pure
// function of the pair, never dependent on call order.
function caveTunnelWidth(a, b) {
  const maxR = Math.max(a.chamberRadius, b.chamberRadius);
  const avgR = (a.chamberRadius + b.chamberRadius) / 2;
  const roll = mulberry32(hashStr('w:' + caveEdgeId(a, b)))();
  if (maxR >= 9) return 3;                    // grand cavern endpoint → broad
  if (avgR >= 5) return roll < 0.6 ? 3 : 2;   // cavern → mostly broad
  if (avgR >= 3) return roll < 0.35 ? 2 : 1;  // chamber → sometimes broad
  return 1;                                    // antechamber-only → narrow
}

// Reject a tunnel that would drive through the CORE of an unrelated chamber in
// the same band. Grazing rims is fine — it makes organic crossroads. The
// ellipse prune skips chambers the meandering path provably cannot reach
// (path deviation is bounded by BEND_MARGIN), so the expensive per-hex check
// runs only for genuine near-misses.
function caveTunnelClear(a, b, localNodes, eid) {
  const ab = hexDistance({q: a.q, r: a.r}, {q: b.q, r: b.r});
  let path = null;
  for (const other of localNodes) {
    if (other.id === a.id || other.id === b.id) continue;
    if (other.bandId !== a.bandId) continue;
    const da = hexDistance({q: other.q, r: other.r}, {q: a.q, r: a.r});
    const db = hexDistance({q: other.q, r: other.r}, {q: b.q, r: b.r});
    if (da + db > ab + 2 * (other.chamberRadius * 0.35 + BEND_MARGIN)) continue;
    if (!path) path = meanderingPath({q: a.q, r: a.r}, {q: b.q, r: b.r}, eid);
    for (const p of path) {
      if (hexDistance({q: p.q, r: p.r}, {q: other.q, r: other.r}) < other.chamberRadius * 0.35) return false;
    }
  }
  return true;
}

// Every tunnel originating at this chamber. A pure function of the node + seed:
// any chunk that computes it gets the identical answer, which is exactly what
// makes chunk seams agree with no communication between them. Memoised —
// neighbouring chunks ask about the same chambers over and over.
const edgeCache = new Map();
function caveEdgesForNode(node) {
  const hit = edgeCache.get(node.id);
  if (hit) return hit;
  const edges = caveEdgesCompute(node);
  edgeCache.set(node.id, edges);
  return edges;
}

function caveEdgesCompute(node) {
  const R = CONNECT_SCAN;
  const near = caveNodesInRegion(node.q - R, node.q + R, node.r - R, node.r + R);
  const rng = mulberry32(hashStr('e:' + worldSeed + ':' + node.id));
  // Draw every random value up-front so the sequence never varies with branches.
  const shortCount = rng() < 0.4 ? 3 : 2;
  const longRoll = rng(), longPick = rng(), zRoll = rng();
  const edges = [];

  const sameBand = near
    .filter(n => n.bandId === node.bandId && n.id !== node.id)
    .map(n => ({ n, d: hexDistance({q: node.q, r: node.r}, {q: n.q, r: n.r}) }))
    .filter(x => x.d > 0 && x.d <= MAX_TUNNEL)
    .sort((x, y) => x.d - y.d || (x.n.id < y.n.id ? -1 : 1));

  let added = 0;
  for (let i = 0; i < sameBand.length && added < shortCount; i++) {
    const cand = sameBand[i].n;
    if (!caveTunnelClear(node, cand, near, caveEdgeId(node, cand))) continue;
    edges.push({ a: node, b: cand, kind: 'tunnel', width: caveTunnelWidth(node, cand) });
    added++;
  }
  // Connectivity fallback — better an imperfect tunnel than an orphaned chamber.
  if (added === 0 && sameBand.length > 0) {
    const cand = sameBand[0].n;
    edges.push({ a: node, b: cand, kind: 'tunnel', width: caveTunnelWidth(node, cand) });
  }
  // ~30% get a long haul — the truly-vast-tunnel feeling.
  if (longRoll < 0.30 && sameBand.length > 6) {
    const cand = sameBand[5 + Math.floor(longPick * Math.min(10, sameBand.length - 5))].n;
    if (caveTunnelClear(node, cand, near, caveEdgeId(node, cand))) {
      edges.push({ a: node, b: cand, kind: 'long-tunnel', width: caveTunnelWidth(node, cand) });
    }
  }
  // Sparse vertical shaft down to the nearest chamber in the band below.
  if (node.bandIdx < CAVE_BANDS.length - 1 && zRoll < Z_TUNNEL_CHANCE) {
    let best = null, bestD = Infinity;
    for (const n of near) {
      if (n.bandIdx !== node.bandIdx + 1) continue;
      const d = hexDistance({q: node.q, r: node.r}, {q: n.q, r: n.r});
      if (d <= MAX_TUNNEL && (d < bestD || (d === bestD && best && n.id < best.id))) { bestD = d; best = n; }
    }
    if (best) edges.push({ a: node, b: best, kind: 'z-tunnel', width: 1 });
  }
  return edges;
}

// A top-band chamber may open to daylight. Only where there's real rock between
// the seabed and the chamber — out past the shelf break the seafloor is deeper
// than the band, so a "sinkhole" there would just be open ocean.
function caveSinkholeForNode(node) {
  if (node.bandIdx !== 0) return null;
  const rng = mulberry32(hashStr('s:' + worldSeed + ':' + node.id));
  if (rng() >= SINKHOLE_CHANCE) return null;
  const searchR = Math.max(3, Math.ceil(node.chamberRadius) + 2);
  for (let attempt = 0; attempt < 30; attempt++) {
    const sq = node.q + Math.round((rng() * 2 - 1) * searchR);
    const sr = node.r + Math.round((rng() * 2 - 1) * searchR);
    const seafloor = shelfSeafloorDepth(sq, sr);
    if (seafloor != null && seafloor < node.depth - DEPTH_GRID) {
      return { id: 'sink:' + node.id, q: sq, r: sr, depth: 0, chamberRadius: 0.5, chamberKind: 'antechamber', bandId: 'surface' };
    }
  }
  return null;
}

function snapToGrid(m) { return Math.round(m / DEPTH_GRID) * DEPTH_GRID; }

// FNV-1a hash of a string to a 32-bit unsigned integer. Used to derive
// deterministic per-chamber and per-edge random seeds from their id strings.
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

// Generate a meandering hex path from a to b. Real caves don't go in
// straight lines; this perturbs the path with intermediate control points
// offset perpendicular to the bee-line. Short paths stay straight (less
// than 4 hexes), longer ones get one or more bends scaled to distance.
function meanderingPath(a, b, edgeId) {
  const dist = hexDistance(a, b);
  if (dist <= 3) return hexLine(a, b);

  const erng = mulberry32(hashStr(edgeId));
  const numBends = Math.max(1, Math.floor(dist / 6));

  const controls = [a];
  for (let i = 1; i <= numBends; i++) {
    const t = i / (numBends + 1);
    const baseQ = a.q + (b.q - a.q) * t;
    const baseR = a.r + (b.r - a.r) * t;
    // Perpendicular direction in pixel space (so bends look right visually)
    const dpx = SQRT3 * ((b.q - a.q) + (b.r - a.r) / 2);
    const dpy = 1.5 * (b.r - a.r);
    const len = Math.hypot(dpx, dpy) || 1;
    const npxNorm = -dpy / len;
    const npyNorm =  dpx / len;
    // Bend magnitude: gentle for short paths, more pronounced for long
    const maxBend = Math.min(5, dist / 4);
    const bendMag = (erng() * 2 - 1) * maxBend * 1.4;
    const pxShift = npxNorm * bendMag;
    const pyShift = npyNorm * bendMag;
    // Convert pixel shift back to hex axial coords
    const rShift = pyShift / 1.5;
    const qShift = pxShift / SQRT3 - rShift / 2;
    controls.push({
      q: Math.round(baseQ + qShift),
      r: Math.round(baseR + rShift),
    });
  }
  controls.push(b);

  // Stitch segments together via hexLine between consecutive controls
  let path = [];
  for (let i = 0; i < controls.length - 1; i++) {
    const segment = hexLine(controls[i], controls[i+1]);
    if (i > 0) segment.shift(); // avoid duplicating shared endpoint
    path = path.concat(segment);
  }
  return path;
}

// Carve a chamber from a graph node. Chambers are domed: tallest at the
// center and narrower at the edges, like a real water-eroded cavern. The
// taper gives the chamber a sense of bounded space and creates natural
// "shallow shelves" at the edges where the floor rises. Future on-foot
// gameplay will use these shallow edges as potential beaches; for now,
// they simply make chambers feel less like uniform cylinders.
function carveChamber(node) {
  const baseRadius = node.chamberRadius;
  // Per-chamber noise: three sinusoidal components define the boundary
  // modulation. The result is a blob with character — peninsulas, inlets,
  // a few prominent lobes — rather than a perfect circle. Bigger chambers
  // get more dramatic distortion; small antechambers stay roughly round.
  const noiseRng = mulberry32(hashStr(node.id || 'unknown'));
  const phases = [noiseRng() * Math.PI * 2, noiseRng() * Math.PI * 2, noiseRng() * Math.PI * 2];
  const amps = baseRadius < 3 ? [0.10, 0.06, 0.04]
             : baseRadius < 6 ? [0.18, 0.10, 0.06]
             :                  [0.22, 0.14, 0.08];
  function shapedRadius(dq, dr) {
    // Use pixel-space angle so the blob looks right visually (hex coords
    // are squished). The threshold compares to hex distance, so this gives
    // a soft modulation rather than a precise pixel-space ellipse.
    const px = SQRT3 * (dq + dr / 2);
    const py = 1.5 * dr;
    const angle = Math.atan2(py, px);
    let factor = 1;
    factor += amps[0] * Math.cos(2 * angle + phases[0]);
    factor += amps[1] * Math.cos(3 * angle + phases[1]);
    factor += amps[2] * Math.cos(5 * angle + phases[2]);
    return baseRadius * factor;
  }

  const baseSpan = 240 + Math.floor(baseRadius) * 60; // 300m to ~1140m at grand cavern scale
  const ri = Math.ceil(baseRadius * 1.4);
  // Always carve center hex with full span (so even tiny chambers exist)
  addVolume(node.q, node.r, 'chamber', 'chamber',
            node.depth - baseSpan / 2, node.depth + baseSpan / 2);
  for (let dq = -ri; dq <= ri; dq++) {
    for (let dr = -ri; dr <= ri; dr++) {
      const ds = -dq - dr;
      if (Math.abs(ds) > ri || Math.abs(dq) > ri || Math.abs(dr) > ri) continue;
      const d = (Math.abs(dq) + Math.abs(dr) + Math.abs(ds)) / 2;
      if (d === 0) continue; // center already carved
      const localR = shapedRadius(dq, dr);
      if (d > localR) continue;
      // Dome taper. Use the noisy localR as the boundary for the t ratio so
      // hexes near the irregular boundary still smoothly compress in span.
      const t = localR > 0 ? Math.min(1, d / localR) : 0;
      const localSpan = Math.max(120, snapToGrid(baseSpan * (1 - t * 0.5)));
      const half = localSpan / 2;
      addVolume(node.q + dq, node.r + dr, 'chamber', 'chamber',
                node.depth - half, node.depth + half);
    }
  }

  // The chamber's contents are part of the chamber (substrate purity):
  // WHETHER and WHERE are hash-rolled from the chamber's id; the TYPE is
  // hash-rolled from the hex itself — so if two overlapping chambers ever
  // elect the same hex, they agree on what sits there, and carve order
  // cannot matter. Sink hexes (incl. the pier entry) are reserved.
  const prng = mulberry32(hashStr('poi:' + worldSeed + ':' + node.id));
  if (prng() < CAVE_POI_CHANCE) {
    const ang = prng() * Math.PI * 2;
    // Elect within the CORE (≤ 0.5×radius): the noise-shaped rim can pinch to
    // ~0.56×radius, so the core is always inside the blob this chamber just
    // carved — the elected cell provably exists regardless of carve order.
    const rad = prng() * Math.max(0.5, baseRadius * 0.5);
    const pr = Math.round(Math.sin(ang) * rad / 1.5);
    const pq = Math.round(Math.cos(ang) * rad / SQRT3 - pr / 2);
    const hq = node.q + pq, hr = node.r + pr;
    const sink = caveSinkholeForNode(node);
    const reserved = (sink && sink.q === hq && sink.r === hr) || (hq === 3 && hr === -1);
    if (!reserved && cells.has(cellKey(hq, hr, node.depth))) {
      const t = world.get(hexKey(hq, hr));
      if (t && !t.poi) {
        const types = ['ruin', 'signal', 'growth', 'growth', 'chasm', 'air', 'salvage'];
        const type = types[hashStr(worldSeed + ':ptype:' + hq + ':' + hr) % types.length];
        setTile(hq, hr, type, true);
      }
    }
  }
}

// Carve a tunnel along a graph edge. Three kinds:
//  - tunnel / long-tunnel: horizontal corridor at interpolated depth between A & B
//  - z-tunnel: horizontal segment at A's depth, then vertical shaft at B's hex down to B
//  - sinkhole: vertical-only opening from a surface hex down into the cave below
function carveEdge(edge) {
  const a = edge.a, b = edge.b;
  if (!a || !b) return;
  const edgeId = caveEdgeId(a, b);
  const width = edge.width || 1;

  // Carve a tunnel hex and (if widening) its perpendicular neighbors. The
  // sides are determined by the direction the path is heading at this hex.
  function carveTunnelHex(p, nextHex, depth, span) {
    addVolume(p.q, p.r, 'passage', 'passage', depth - span / 2, depth + span / 2);
    if (width >= 2 && nextHex && (nextHex.q !== p.q || nextHex.r !== p.r)) {
      const neighbors = hexNeighbors(p.q, p.r);
      let dir = -1;
      for (let k = 0; k < 6; k++) {
        if (neighbors[k].q === nextHex.q && neighbors[k].r === nextHex.r) { dir = k; break; }
      }
      if (dir >= 0) {
        const perpL = (dir + 2) % 6;
        const perpR = (dir + 4) % 6;
        // Width 2 carves one consistent side; width 3 carves both
        if (width >= 3) {
          addVolume(neighbors[perpL].q, neighbors[perpL].r, 'passage', 'passage', depth - span / 2, depth + span / 2);
          addVolume(neighbors[perpR].q, neighbors[perpR].r, 'passage', 'passage', depth - span / 2, depth + span / 2);
        } else {
          const side = (hashStr(edgeId) % 2 === 0) ? perpL : perpR;
          addVolume(neighbors[side].q, neighbors[side].r, 'passage', 'passage', depth - span / 2, depth + span / 2);
        }
      }
    }
  }

  if (edge.kind === 'tunnel' || edge.kind === 'long-tunnel') {
    const path = meanderingPath({q: a.q, r: a.r}, {q: b.q, r: b.r}, edgeId);
    const tunnelSpan = 180 + Math.max(0, width - 1) * 30;
    for (let i = 0; i < path.length; i++) {
      const p = path[i];
      const t = path.length > 1 ? i / (path.length - 1) : 0;
      const depth = snapToGrid(a.depth + (b.depth - a.depth) * t);
      carveTunnelHex(p, path[i + 1], depth, tunnelSpan);
    }
  } else if (edge.kind === 'z-tunnel') {
    // Horizontal segment at A's depth, then vertical shaft at B's hex.
    // Z-tunnels stay narrow (width 1) — they're transitions, not highways.
    const path = meanderingPath({q: a.q, r: a.r}, {q: b.q, r: b.r}, edgeId);
    const tunnelSpan = 180;
    for (let i = 0; i < path.length; i++) {
      const p = path[i];
      addVolume(p.q, p.r, 'passage', 'passage', a.depth - tunnelSpan / 2, a.depth + tunnelSpan / 2);
    }
    const shaftTop = Math.min(a.depth, b.depth) - 60;
    const shaftBot = Math.max(a.depth, b.depth) + 60;
    addVolume(b.q, b.r, 'passage', 'passage', shaftTop, shaftBot);
  } else if (edge.kind === 'sinkhole') {
    // Surface to cave: A is the surface entry (depth 0), B is the cave chamber.
    // The shaft reaches the chamber's deepest point so a diver at the floor
    // can still swim sideways into the sinkhole hex. Mirrors carveChamber.
    const chamberHalfSpan = (240 + Math.floor(b.chamberRadius) * 60) / 2;
    addVolume(a.q, a.r, 'passage', 'passage', 0, b.depth + chamberHalfSpan);
    const tile = world.get(hexKey(a.q, a.r));
    if (tile && !tile.poi) {
      world.set(hexKey(a.q, a.r), makeTile('opening', a.q, a.r, tile.ceiling, tile.floor, tile.bestPrio));
    }
    // Horizontal corridor at chamber depth, meandering toward the chamber.
    const path = meanderingPath({q: a.q, r: a.r}, {q: b.q, r: b.r}, edgeId);
    const corridorSpan = 180;
    for (let i = 0; i < path.length; i++) {
      const p = path[i];
      addVolume(p.q, p.r, 'passage', 'passage', b.depth - corridorSpan / 2, b.depth + corridorSpan / 2);
    }
  }
}

// Directional shelf seafloor depth. Coast is at r=2; north of coast is open
// water, gently sloping down then plunging at the shelf break. East/west of
// the bay channel are mountains (impassable stone).
function shelfSeafloorDepth(q, r) {
  // North distance from the coast line. Positive = water; <= 0 means land.
  const northDist = 1.5 - r;
  if (northDist <= 0) return null;

  // East-west offset from the bay centerline. Bay widens slowly going north.
  const eastWestOffset = Math.abs(q + r * 0.5);
  const bayWidth = 4 + northDist * 0.12;
  // Beyond shelf break, no walls — open ocean in all directions
  if (eastWestOffset > bayWidth && northDist < 32) return null;

  let depth;
  if (northDist < 5) {
    // Gentle near-shore decline
    depth = 50 + northDist * 35;        // 50 → 225
  } else if (northDist < 25) {
    // Continental shelf — relatively flat with gentle slope
    depth = 225 + (northDist - 5) * 5;  // 225 → 325
  } else if (northDist < 32) {
    // Shelf break — drops rapidly into the deep
    const t = (northDist - 25) / 7;
    depth = 325 + t * t * 2000;         // 325 → 2325
  } else {
    // Open deep ocean (the player can swim out here but there's nothing yet)
    depth = 2325 + (northDist - 32) * 80;
  }
  return depth;
}

// Mountain check: any hex that's not shelf water, not south of coast, but
// beyond the bay walls. Used to leave walls in place during chunk generation.
function isMountainHex(q, r) {
  const northDist = 1.5 - r;
  if (northDist <= 0) return false;
  const eastWestOffset = Math.abs(q + r * 0.5);
  const bayWidth = 4 + northDist * 0.12;
  return eastWestOffset > bayWidth && northDist < 32;
}

const CHUNK = 14; // hex coords per chunk side

function chunkKey(cq, cr) { return cq + '|' + cr; }
function hexToChunk(q, r) {
  return { cq: Math.floor(q / CHUNK), cr: Math.floor(r / CHUNK) };
}

// Which zone is this hex in? Used both by generation and by runtime
// transition messaging ("you have left the shelf", etc).
function hexZone(q, r) {
  const { cq, cr } = hexToChunk(q, r);
  const d = Math.sqrt(cq*cq + cr*cr + cq*cr);
  if (d < 3) return 'shelf';
  if (d < 5) return 'shelf-edge';
  return 'deep';
}
function zoneRank(zone) {
  return zone === 'shelf' ? 0 : zone === 'shelf-edge' ? 1 : 2;
}

function setTile(q, r, type, force) {
  const t = TILES[type];
  const k = hexKey(q, r);
  const existing = world.get(k);
  if (!force && existing && !existing.wall && t.wall) return; // never re-stone
  const open = existing && !existing.wall;
  if (t.wall) {
    // Wall/land tile is solid — it owns no open cells. Drop any this hex had.
    if (open) clearHexCells(q, r, existing.ceiling, existing.floor);
    world.set(k, makeTile(type, q, r, 0, 0, 0));
  } else {
    // Overlaying a feature (POI) on open space — keep the hex's open extent
    // and its accumulated kind priority.
    world.set(k, makeTile(type, q, r, open ? existing.ceiling : 0, open ? existing.floor : 0,
                          open ? (existing.bestPrio || 0) : 0));
  }
}

function makeTile(type, q, r, ceiling, floor, bestPrio) {
  const t = TILES[type];
  // A tile is hex-level display metadata only. The voxel `cells` map holds the
  // actual open/closed structure; ceiling/floor cache this hex's open extent
  // (shallowest/deepest open cell) for the depth gauge and spawn logic.
  // bestPrio caches the highest kind priority ever carved into this hex — an
  // order-independent max that survives POI overlays, so the display type
  // never needs a full extent rescan.
  return { type, q, r, ...t, ceiling: ceiling || 0, floor: floor || 0, bestPrio: bestPrio || 0 };
}

// Add an open volume to a hex. Volumes that overlap or touch are merged.
// Snap a depth to the 60-meter grid. The sub moves vertically in 60-meter
// increments, so any volume bound that isn't a multiple of 60 is unreachable
// in practice. Snapping at insertion keeps the math honest everywhere.
const DEPTH_GRID = 60;
function snapDepth(m, mode) {
  if (mode === 'ceiling') return Math.ceil(m / DEPTH_GRID) * DEPTH_GRID;
  if (mode === 'floor')   return Math.floor(m / DEPTH_GRID) * DEPTH_GRID;
  return Math.round(m / DEPTH_GRID) * DEPTH_GRID;
}

// ---- Cell model maintenance ---------------------------------------------
// The voxel `cells` map is the sole structural source of truth. addVolume
// stamps open cells; clearHexCells drops them when a hex is walled. A hex's
// tile carries only display metadata plus its open extent (ceiling/floor).
function clearHexCells(q, r, ceiling, floor) {
  for (let d = ceiling; d <= floor; d += DEPTH_GRID) cells.delete(cellKey(q, r, d));
}
// Dev assertion — call verifyCells() in the console. A hex's cached ceiling and
// floor must themselves be open cells (the shallowest/deepest open slices), and
// no wall tile may own a cell. "0 bad" means the model is internally sound.
function verifyCells() {
  let bad = 0;
  for (const [k, tile] of world) {
    if (tile.wall) continue;
    const [q, r] = k.split(',').map(Number);
    if (!cells.has(cellKey(q, r, tile.ceiling)) || !cells.has(cellKey(q, r, tile.floor))) bad++;
  }
  console.log(`verifyCells: ${bad} bad tiles · ${cells.size} cells`);
  return { bad, cells: cells.size };
}

function addVolume(q, r, type, kind, ceiling, floor) {
  if (TILES[type].wall) return;
  // Snap to grid: ceiling rounds UP (so we don't claim space that doesn't
  // exist), floor rounds DOWN. Every bound is then reachable by 60-m moves.
  ceiling = snapDepth(Math.max(0, ceiling), 'ceiling');
  floor   = snapDepth(floor, 'floor');
  if (floor <= ceiling) return; // degenerate after snapping
  const k = hexKey(q, r);
  const existing = world.get(k);
  if (existing && existing.land) return; // shore/dock inviolable — never carve them

  // Stamp this run's open cells. Where runs overlap, the higher-priority kind
  // wins (sea > chamber > passage > water) so the cell reads as the grander space.
  for (let d = ceiling; d <= floor; d += DEPTH_GRID) {
    const ck = cellKey(q, r, d);
    const ex = cells.get(ck);
    if (!ex || kindPriority(kind) > kindPriority(ex.kind)) cells.set(ck, { type: kindToType(kind), kind });
  }

  // Accumulate the hex's open extent and pick its display type (dominant
  // kind), unless it already carries a POI — those keep their own symbol.
  // bestPrio is a running max over every kind ever carved here, so this is
  // O(1) per carve and independent of carve order (max is commutative).
  const open = existing && !existing.wall;
  const newCeiling = open ? Math.min(existing.ceiling, ceiling) : ceiling;
  const newFloor   = open ? Math.max(existing.floor, floor)     : floor;
  const newPrio    = Math.max(open ? (existing.bestPrio || 0) : 0, kindPriority(kind));
  const isExistingPoi = open && TILES[existing.type] && TILES[existing.type].poi;
  const chosenType = isExistingPoi ? existing.type : kindToType(PRIO_TO_KIND[newPrio]);
  world.set(k, makeTile(chosenType, q, r, newCeiling, newFloor, newPrio));
}
const PRIO_TO_KIND = ['water', 'passage', 'chamber', 'sea'];

function kindPriority(kind) {
  const m = { water: 0, passage: 1, chamber: 2, sea: 3 };
  return m[kind] ?? 0;
}

function kindToType(kind) {
  return TILES[kind] ? kind : 'passage';
}

// Backwards-compatible single-range setter. Most generators still call this.
function setOpenTile(q, r, type, ceiling, floor) {
  const kind = ['water', 'passage', 'chamber', 'sea'].includes(type) ? type : 'passage';
  addVolume(q, r, type, kind, ceiling, floor);
}

function getTile(q, r) {
  return world.get(hexKey(q, r));
}

function tileAt(q, r) {
  // Ensure the chunk containing this hex AND its neighbors are generated.
  // Generating neighbors guarantees features that cross chunk borders are
  // continuous before the player sees the seam.
  const {cq, cr} = hexToChunk(q, r);
  for (let dcq = -1; dcq <= 1; dcq++) {
    for (let dcr = -1; dcr <= 1; dcr++) {
      ensureChunk(cq + dcq, cr + dcr);
    }
  }
  const k = hexKey(q, r);
  if (!world.has(k)) setTile(q, r, 'stone', true);
  return world.get(k);
}

function ensureChunk(cq, cr) {
  const k = chunkKey(cq, cr);
  if (generatedChunks.has(k)) return;
  generatedChunks.add(k);
  generateChunk(cq, cr);
}

// Per-chunk seeded RNG so chunks are deterministic
function chunkRng(cq, cr) {
  const s = (worldSeed ^ (cq * 73856093) ^ (cr * 19349663)) >>> 0;
  return mulberry32(s);
}

// Generate a chunk by carving the part of the world graph that intersects it,
// plus directional shelf water and origin features. Idempotent — re-running
// produces the same result because the graph is deterministic.
function generateChunk(cq, cr) {
  const crng = chunkRng(cq, cr);
  const crand = () => crng();
  const cpick = (a) => a[Math.floor(crand() * a.length)];

  const q0 = cq * CHUNK, q1 = q0 + CHUNK;
  const r0 = cr * CHUNK, r1 = r0 + CHUNK;

  // Step 1: Shelf water + mountains. Each hex computes its seafloor from the
  // directional shelf formula. If the formula returns null, the hex is land
  // (mountain or south of coast) and stays as stone.
  for (let q = q0; q < q1; q++) {
    for (let r = r0; r < r1; r++) {
      const seafloor = shelfSeafloorDepth(q, r);
      if (seafloor != null) {
        addVolume(q, r, 'water', 'water', 0, seafloor);
      }
    }
  }

  // Step 2: Cave network — computed LOCALLY, and therefore infinitely. Every
  // chamber within tunnel-reach of this chunk comes from the deterministic
  // lattice, and every tunnel those chambers originate is carved if it touches
  // us. No global graph, no edge of the world. Each feature carves exactly
  // ONCE (carving writes cells globally, wherever they land), tracked in
  // carvedFeatures — the first generated chunk a feature touches carves all
  // of it. The carve itself is a pure function of the feature, so which chunk
  // performs it cannot matter.
  const CHAMBER_PAD = 24; // covers a grand cavern's full rim (radius ≤ 15 × 1.4)
  const EDGE_PAD = 10;    // covers a meandering path's max deviation from its bbox
  const scanR = MAX_TUNNEL + BEND_MARGIN;
  const nodes = caveNodesInRegion(q0 - scanR, q1 + scanR, r0 - scanR, r1 + scanR);
  const touches = (aq, ar, bq, br, pad) => !(
    Math.max(aq, bq) < q0 - pad || Math.min(aq, bq) >= q1 + pad ||
    Math.max(ar, br) < r0 - pad || Math.min(ar, br) >= r1 + pad);

  for (const node of nodes) {
    if (touches(node.q, node.r, node.q, node.r, CHAMBER_PAD) && !carvedFeatures.has('c:' + node.id)) {
      carvedFeatures.add('c:' + node.id);
      carveChamber(node);
    }
  }
  for (const node of nodes) {
    for (const e of caveEdgesForNode(node)) {
      const eid = 'e:' + caveEdgeId(e.a, e.b);
      if (carvedFeatures.has(eid)) continue;
      if (touches(e.a.q, e.a.r, e.b.q, e.b.r, EDGE_PAD)) {
        carvedFeatures.add(eid);
        carveEdge(e);
      }
    }
    // Daylight: a top-band chamber may punch a sinkhole up through the seabed.
    const sink = caveSinkholeForNode(node);
    if (sink && !carvedFeatures.has('s:' + node.id)
        && touches(sink.q, sink.r, node.q, node.r, EDGE_PAD)) {
      carvedFeatures.add('s:' + node.id);
      carveEdge({ a: sink, b: node, kind: 'sinkhole', width: 1 });
    }
  }

  // Step 3: Origin specifics — surface marker, dock, shoreline.
  if (cq === 0 && cr === 0) {
    addVolume(0, 0, 'water', 'water', 0, 100);
    let oTile = world.get(hexKey(0, 0));
    world.set(hexKey(0, 0), makeTile('surface', 0, 0, oTile.ceiling, oTile.floor, oTile.bestPrio));
    // Pier: single straight column at q=1, r=0→2, pointing into the beach.
    setTile(1, 0, 'dock', true);
    setTile(1, 1, 'dock', true);
    setTile(1, 2, 'dock', true);
    const shoreHexes = [
      // right column extension
      {q:3, r:1},
      // r=2: left extension column top + junction gap-fills + right extension
      {q:-5, r:2}, {q:-4, r:2}, {q:-3, r:2}, {q:-2, r:2}, {q:-1, r:2}, {q:0, r:2}, {q:2, r:2}, {q:3, r:2},
      // r=3: solid full row
      {q:-5, r:3}, {q:-4, r:3}, {q:-3, r:3}, {q:-2, r:3}, {q:-1, r:3}, {q:0, r:3}, {q:1, r:3}, {q:2, r:3}, {q:3, r:3},
      // r=4: solid full row
      {q:-5, r:4}, {q:-4, r:4}, {q:-3, r:4}, {q:-2, r:4}, {q:-1, r:4}, {q:0, r:4}, {q:1, r:4}, {q:2, r:4}, {q:3, r:4},
      // r=5: bottom row
      {q:-5, r:5}, {q:-4, r:5}, {q:-3, r:5}, {q:-2, r:5}, {q:-1, r:5}, {q:0, r:5}, {q:1, r:5}, {q:2, r:5}, {q:3, r:5},
    ];
    for (const h of shoreHexes) setTile(h.q, h.r, 'shore', true);

    // Guaranteed pier entrance: a sinkhole just NE of the dock dropping into
    // the nearest top-band chamber, so the player always has a way under —
    // never at the mercy of whether the lattice happened to open one nearby.
    const pierEntry = { id: 'pier-entry', q: 3, r: -1, depth: 0, chamberRadius: 0.5, chamberKind: 'antechamber', bandId: 'surface' };
    const pierTarget = caveNodesInRegion(pierEntry.q - MAX_TUNNEL, pierEntry.q + MAX_TUNNEL,
                                         pierEntry.r - MAX_TUNNEL, pierEntry.r + MAX_TUNNEL)
      .filter(n => n.bandIdx === 0)
      .map(n => ({ n, d: hexDistance({q: pierEntry.q, r: pierEntry.r}, {q: n.q, r: n.r}) }))
      .sort((x, y) => x.d - y.d || (x.n.id < y.n.id ? -1 : 1))[0];
    if (pierTarget) carveEdge({ a: pierEntry, b: pierTarget.n, kind: 'sinkhole', width: 1 });
  }

  // Step 4: Shelf features — pure hash-of-hex, so every client computes the
  // same kelp bed and the same wreck in the same place. Gated on "open to the
  // sky" via the cell at depth 0 (order-independent), not on display type.
  // Chamber POIs are rolled inside carveChamber; tunnels stay empty —
  // chambers are the destinations.
  const openCaveHexes = []; // collected for creature spawning (Step 5)
  for (let q = q0; q < q1; q++) {
    for (let r = r0; r < r1; r++) {
      const t = world.get(hexKey(q, r));
      if (!t || t.wall || t.land || t.poi) continue;
      if (t.type === 'passage' || t.type === 'chamber') openCaveHexes.push({q, r});
      if (!cells.has(cellKey(q, r, 0))) continue;
      const roll = hashStr(worldSeed + ':shelf:' + q + ':' + r) / 4294967296;
      if (roll < SHELF_KELP_ROLL) {
        setTile(q, r, roll < SHELF_SALVAGE_ROLL ? 'salvage' : 'kelp', true);
      }
    }
  }

  // Step 5: Creatures — rolled once per chunk, ever. The world regenerates
  // from seed; its inhabitants are overlay state (spawnedChunks is saved).
  // Home waters around the dock stay empty — dread is earned by distance.
  const chunkK = chunkKey(cq, cr);
  if (!spawnedChunks.has(chunkK)) {
    spawnedChunks.add(chunkK);
    const homeWaters = cq === 0 && cr === 0;
    if (!homeWaters && openCaveHexes.length >= 6) {
      // Only actual open cave cells will do — creatures obey the voxels.
      const caveDepthsAt = (h) => {
        const t = world.get(hexKey(h.q, h.r));
        if (!t || t.wall) return [];
        const opts = [];
        for (let d = t.ceiling; d <= t.floor; d += DEPTH_GRID) {
          const c = cells.get(cellKey(h.q, h.r, d));
          if (c && (c.kind === 'passage' || c.kind === 'chamber')) opts.push(d);
        }
        return opts;
      };
      // Band biomes: the mix of life changes with depth. Shallow caves breed
      // drifters and thieving eels; the deep water belongs to the hunters.
      const rolls = 1 + Math.floor(crand() * 2);
      for (let i = 0; i < rolls; i++) {
        if (crand() >= 0.55) continue;
        const h = openCaveHexes[Math.floor(crand() * openCaveHexes.length)];
        const opts = caveDepthsAt(h);
        if (!opts.length) continue;
        const depth = opts[Math.floor(crand() * opts.length)];
        const roll = crand();
        const type = depth >= 2400 ? (roll < 0.55 ? 'lurker' : roll < 0.80 ? 'drifter' : 'eel')
                   : depth >= 1200 ? (roll < 0.40 ? 'lurker' : roll < 0.70 ? 'drifter' : 'eel')
                   :                 (roll < 0.22 ? 'lurker' : roll < 0.60 ? 'drifter' : 'eel');
        spawnCreature(type, h.q, h.r, depth);
      }
      // And rarely — engine noise. Another boat works these waters. Rivals
      // seek unworked sites, put divers down, and strip them first.
      if (crand() < 0.06) {
        const h = openCaveHexes[Math.floor(crand() * openCaveHexes.length)];
        const opts = caveDepthsAt(h);
        if (opts.length) spawnCreature('rival', h.q, h.r, opts[0]);
      }
    }
  }
}

  get r() { return this.entities[0].r; },
  set r(v) { this.entities[0].r = v; },

  poisFound: [],
  alive: true,

  lastMoveTime: 0,

  // Zone tracking for "you have left the shelf" style transitions
  lastZone: 'shelf',
  maxZoneReached: 0,        // 0=shelf, 1=shelf-edge, 2=deep
  // Active ping animation
  ping: null,               // { startTime, durationMs, maxRadiusPx, originQ, originR, power } | null
  // Ping memory: hexKey -> turns remaining (0 means forgotten). Decremented
  // each turn. While > 0 the hex's wall edges remain visible at reduced intensity.
  pingMemory: new Map(),
  // Living things in the water. Overlay state — saved with the run.
  creatures: [],
  // The first economy: crates aboard, and crates banked ashore at the dock.
  cargo: 0,
  cargoBanked: 0,
  // Relics: expedition treasure — worth more than crates, someday.
  relics: 0,
  relicsBanked: 0,
  // Active dive team, or null. { key, type, turns, crates, relics }
  expedition: null,
};

//=============================================================================
// RENDER
//=============================================================================

const svg = document.getElementById('chart-svg');
let viewW = 0, viewH = 0;
let zoom = 2.4; // Higher = more zoomed in. 1.0 = native pixel size.
// Refs updated by render() so gesture handlers can do cheap viewport-only
// updates (transform on the world group) without rebuilding the whole tree.
let worldGroupEl = null;
let lastCamX = 0, lastCamY = 0;

function setViewport() {
  const rect = document.getElementById('chart-container').getBoundingClientRect();
  viewW = rect.width;
  viewH = rect.height;
  // The viewBox dimensions are divided by zoom so a higher zoom shows less world
  const vw = viewW / zoom;
  const vh = viewH / zoom;
  svg.setAttribute('viewBox', `${-vw/2} ${-vh/2} ${vw} ${vh}`);
  svg.setAttribute('width', viewW);
  svg.setAttribute('height', viewH);
}

function render() {
  // Clear
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  // Defs for filters & gradients
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  `;
  svg.appendChild(defs);

  // Camera target follows player smoothly. User-applied pan is layered on top.
  const playerPx = hexToPixel(state.q, state.r);
  state.cameraX += (playerPx.x - state.cameraX) * 0.3;
  state.cameraY += (playerPx.y - state.cameraY) * 0.3;
  const camX = state.cameraX + state.panX;
  const camY = state.cameraY + state.panY;

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `translate(${-camX}, ${-camY})`);
  svg.appendChild(g);
  // Save references for cheap pan updates during drag — we can update the
  // transform attribute without rebuilding the entire SVG tree.
  worldGroupEl = g;
  lastCamX = camX;
  lastCamY = camY;

  // Visible viewport in WORLD coordinates (already divided by zoom)
  const halfW = viewW / (2 * zoom) + HEX_SIZE * 2;
  const halfH = viewH / (2 * zoom) + HEX_SIZE * 2;

  const qRange = Math.ceil(halfW / (HEX_SIZE * SQRT3)) + 2;
  const rRange = Math.ceil(halfH / (HEX_SIZE * 1.5)) + 2;

  // Iterate from the camera center, not the player — so panning shows new areas
  const camCenter = pixelToHex(camX, camY);

  const playerHex = { q: state.q, r: state.r };
  const SIGHT = 3;

  // Edge lines collected here and flushed after all fills so they always
  // render on top, regardless of which stone/water hex was iterated first.
  const pendingEdges = [];

  for (let dr = -rRange; dr <= rRange; dr++) {
    for (let dq = -qRange; dq <= qRange; dq++) {
      const q = camCenter.q + dq;
      const r = camCenter.r + dr;

      const px = hexToPixel(q, r);
      const dx = px.x - camX;
      const dy = px.y - camY;
      if (Math.abs(dx) > halfW || Math.abs(dy) > halfH) continue;

      const tile = tileAt(q, r);
      const key = hexKey(q, r);
      const isVisited = visited.has(key);
      const isRevealed = revealed.has(key);
      const isPlayer = (q === state.q && r === state.r);
      const dFromPlayer = hexDistance({q, r}, playerHex);

      // Walls: stone draws NOTHING (pure void = labyrinth). Land (shore/dock)
      // does render — it's a visible solid surface that bounds the world.
      // But the surface is only visible if the sub is near the surface; at
      // depth, the chart hides land that's hundreds of meters above.
      if (tile.wall) {
        const landVisible = state.currentDepth === 0
                          || isRevealed
                          || hexNeighbors(q, r).some(n => revealed.has(hexKey(n.q, n.r)));
        if (tile.land && landVisible && hexNearDepth(tile, state.currentDepth)) {
          const lp = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          lp.setAttribute('points', hexCorners(px.x, px.y, HEX_SIZE * 1.02));
          lp.setAttribute('fill', tile.color);
          lp.setAttribute('opacity', '1');
          lp.setAttribute('stroke', 'none');
          g.appendChild(lp);
          // Land texture: a small mottled dot to suggest earth/timber
          if (tile.type === 'dock') {
            // Dock pylons — two short verticals
            for (const offset of [-3, 3]) {
              const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              ln.setAttribute('x1', px.x + offset);
              ln.setAttribute('y1', px.y - 4);
              ln.setAttribute('x2', px.x + offset);
              ln.setAttribute('y2', px.y + 4);
              ln.setAttribute('stroke', '#1a1208');
              ln.setAttribute('stroke-width', '1.2');
              g.appendChild(ln);
            }
            // Crossbeam
            const cb = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            cb.setAttribute('x1', px.x - 5);
            cb.setAttribute('y1', px.y - 1);
            cb.setAttribute('x2', px.x + 5);
            cb.setAttribute('y2', px.y - 1);
            cb.setAttribute('stroke', '#1a1208');
            cb.setAttribute('stroke-width', '1');
            g.appendChild(cb);
          } else {
            // Shore: a few specks of darker earth for texture
            for (let i = 0; i < 3; i++) {
              const ang = (q * 13 + r * 7 + i * 41) % 360 * Math.PI / 180;
              const rr = HEX_SIZE * 0.35;
              const dx = Math.cos(ang) * rr;
              const dy = Math.sin(ang) * rr;
              const spk = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
              spk.setAttribute('cx', px.x + dx);
              spk.setAttribute('cy', px.y + dy);
              spk.setAttribute('r', '1');
              spk.setAttribute('fill', '#1a1208');
              spk.setAttribute('opacity', '0.7');
              g.appendChild(spk);
            }
          }
        }
        // Stone fills when the player is near an adjacent open cave at the current
        // depth. At depth 0 (surface view) all bay-bordering cliffs are always
        // visible; deeper, revealFade gates them so surface pings don't expose
        // underground walls. Color shifts from dark brown (surface cliffs) to
        // warm grey (cave walls) below the surface.
        if (!tile.land) {
          const isSurf0 = state.currentDepth === 0;
          // At depth 0 every stone tile is visible — surface map view shows
          // all rock (cliffs, seafloor, mountains). Below surface, only stone
          // adjacent to an explored cave at the current depth renders.
          const seen = isSurf0 || hexNeighbors(q, r).some(n => {
            const nt = tileAt(n.q, n.r);
            if (nt.wall) return false;
            // At shallow depths ocean tiles always illuminate adjacent stone
            if (state.currentDepth <= 5 * DEPTH_GRID && hexNearDepth(nt, 0)) return true;
            // Stone is a column — the adjacent passage needn't contain exactly
            // the current depth, just be explored within the 180m fade window.
            return revealFade(n.q, n.r, state.currentDepth) > 0 && hexNearDepth(nt, state.currentDepth);
          });
          if (seen) {
            const stoneColor = state.currentDepth >= 3 * DEPTH_GRID ? '#3c3c44' : '#7a4820';
            const stoneAlpha = Math.max(0.6, 0.88 - Math.max(0, dFromPlayer - SIGHT) * 0.05);
            const sp = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            sp.setAttribute('points', hexCorners(px.x, px.y, HEX_SIZE * 1.02));
            sp.setAttribute('fill', stoneColor);
            sp.setAttribute('opacity', stoneAlpha.toFixed(2));
            sp.setAttribute('stroke', 'none');
            sp.setAttribute('pointer-events', 'none');
            g.appendChild(sp);
          }
        }
        continue;
      }

      // Surface (depth 0): bypass fog-of-war — show all surface-water tiles as
      // open ocean. At depth, revealFade gates what the sub has explored.
      const isSurf = state.currentDepth === 0;
      const cd     = state.currentDepth;
      let fade;
      if (isSurf) {
        // Tiles within 2 depth-steps (≤120m ceiling) read as navigable ocean → blue.
        // Deeper cave tiles (ceiling ≥180m) are seafloor rock from the surface
        // perspective: sub can't enter them at depth 0, so they look like stone.
        if (!hexNearDepth(tile, 0)) {
          const dsp = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          dsp.setAttribute('points', hexCorners(px.x, px.y, HEX_SIZE * 1.02));
          dsp.setAttribute('fill', '#7a4820');
          dsp.setAttribute('opacity', Math.max(0.6, 0.88 - Math.max(0, dFromPlayer - SIGHT) * 0.05).toFixed(2));
          dsp.setAttribute('stroke', 'none');
          dsp.setAttribute('pointer-events', 'none');
          g.appendChild(dsp);
          continue;
        }
        fade = 1;
      } else {
        // Water tile with no volume at this depth looks like a rock wall —
        // e.g. a passage ceiling=180m appears as a cliff face when you're at 60m.
        if (!hexAcceptsDepth(tile, cd)) {
          // One epistemic rule for rock and water alike: a face renders only
          // if the lights touch it (adjacent), the sonar has returned it
          // (this hex revealed — ping rays reveal the wall they stop on), or
          // it borders water the player actually knows. No free knowledge of
          // unattached rock floating beyond the boat's senses.
          const seen = dFromPlayer <= 1 || revealFade(q, r, cd) > 0
            || hexNeighbors(q, r).some(n => {
              const nt = tileAt(n.q, n.r);
              if (nt.wall || !hexAcceptsDepth(nt, cd)) return false;
              if (cd <= 5 * DEPTH_GRID && hexNearDepth(nt, 0)) return true;
              return revealFade(n.q, n.r, cd) > 0;
            });
          if (seen) {
            const rsp = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            rsp.setAttribute('points', hexCorners(px.x, px.y, HEX_SIZE * 1.02));
            rsp.setAttribute('fill', cd >= 3 * DEPTH_GRID ? '#3c3c44' : '#7a4820');
            rsp.setAttribute('opacity', Math.max(0.6, 0.88 - Math.max(0, dFromPlayer - SIGHT) * 0.05).toFixed(2));
            rsp.setAttribute('stroke', 'none');
            rsp.setAttribute('pointer-events', 'none');
            g.appendChild(rsp);
          }
          continue;
        }
        fade = isPlayer ? 1 : revealFade(q, r, cd);
        // At ≤300 m, surface-accessible ocean tiles are always lit — sunlight
        // and reflections illuminate the water column throughout this zone.
        if (cd <= 5 * DEPTH_GRID && hexNearDepth(tile, 0)) fade = 1;
        // Sub floodlights also illuminate cave tiles within the bright bubble
        const bubbleR = cd <= 2 * DEPTH_GRID ? 3 : cd <= 5 * DEPTH_GRID ? 2 : -1;
        // Roofed caves get no sunlight bounce — lights only reach adjacent.
        if (dFromPlayer <= (hexNearDepth(tile, 0) ? bubbleR : 1)) fade = 1;
      }
      if (fade === 0) continue;

      // Depth visibility model:
      //   0 m        — full ocean view, gradient falloff, minimum 50%
      //   60–300 m   — ocean stays visible; bright inner zone (r=3 at 60-120m,
      //                r=2 at 180-300m) with a noticeable drop at the edge, then
      //                dim non-black falloff — the whole water column is lit by
      //                surface reflections (epipelagic/mesopelagic zones)
      //   > 300 m    — cave darkness: tight SIGHT bubble, explore-gated
      let alpha;
      let fillColor = tile.color;
      if (isSurf) {
        fillColor = '#3090c8';
        const base = isVisited ? 1.0 : 0.85;
        alpha = Math.max(0.50, base - dFromPlayer * 0.045);
      } else if (cd <= 5 * DEPTH_GRID) {
        // step 1..5 = depths 60m..300m
        const step   = cd / DEPTH_GRID;
        const innerR = cd <= 2 * DEPTH_GRID ? 3 : 2;
        // Brightness values decay with depth
        const innerA = Math.max(0.58, 0.95 - (step - 1) * 0.075); // 0.95→0.65
        const dropA  = Math.max(0.28, 0.65 - (step - 1) * 0.075); // 0.65→0.35
        const minA   = Math.max(0.18, 0.50 - (step - 1) * 0.080); // 0.50→0.18
        const outerR = 0.038 + (step - 1) * 0.010;                 // 0.038→0.078
        if (dFromPlayer <= innerR) {
          alpha = Math.max(innerA * 0.94, innerA - dFromPlayer * 0.018); // near-flat
        } else if (dFromPlayer === innerR + 1) {
          alpha = dropA;                                 // noticeable drop at bubble edge
        } else {
          alpha = Math.max(minA, dropA - (dFromPlayer - innerR - 1) * outerR);
        }
        // Cave tiles (not surface-accessible) still dim by exploration state
        if (!hexNearDepth(tile, 0)) alpha *= fade;
        // 60-120m: ocean blue matches surface feel; 180-300m: mesopelagic dark blue
        fillColor = cd <= 2 * DEPTH_GRID ? '#3090c8' : '#1a6090';
      } else {                                     // > 300 m — cave darkness
        if (isVisited) {
          alpha = dFromPlayer <= SIGHT ? 1 : Math.max(0.4, 1 - (dFromPlayer - SIGHT) * 0.12);
        } else {
          alpha = dFromPlayer <= SIGHT ? 0.7 : Math.max(0.28, 0.7 - (dFromPlayer - SIGHT) * 0.1);
        }
        alpha *= fade;
      }

      // Hex floor — fills merge where tiles touch; crisp edge against void is the wall.
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      // Slight overdraw (1.02x) prevents hairline seams between adjacent open hexes
      poly.setAttribute('points', hexCorners(px.x, px.y, HEX_SIZE * 1.02));
      poly.setAttribute('fill', fillColor);
      poly.setAttribute('opacity', alpha);
      poly.setAttribute('stroke', 'none');
      g.appendChild(poly);

      // Bright edges: any boundary between a sub-reachable hex and a
      // not-currently-passable one (wall, OR open water at incompatible depth)
      // lights up. Drawn from the sub-reachable side, once per edge.
      const passiveR = passiveRange();
      const inPassive = passiveR > 0 && dFromPlayer < passiveR;
      const pingMemTurns = state.pingMemory.get(key) || 0;
      const memFade = pingMemTurns / 5;
      const edgesVisible = inPassive || pingMemTurns > 0;
      const edgeIntensity = inPassive ? 1 : memFade;
      const tileIsReachable = !tile.wall && hexAcceptsDepth(tile, state.currentDepth);

      if (edgesVisible && tileIsReachable) {
        const nbrs = hexNeighbors(q, r);
        for (let k = 0; k < 6; k++) {
          const n = nbrs[k];
          const nt = tileAt(n.q, n.r);
          // Decide what to draw on the edge between (q,r) and (n.q,n.r).
          // Three cases:
          //   1. Adjacent hex is solid wall (stone or shore/dock) → grey or earth.
          //   2. Adjacent hex has open water but not at sub's depth → blue tones
          //      encoding direction (light = above, dark = below, dual = both).
          //   3. Adjacent hex is reachable → no edge drawn.
          let wallColor = null;     // single-line color, if applicable
          let aboveColor = null;    // dual-line: water above sub's depth
          let belowColor = null;    // dual-line: water below sub's depth
          if (nt.wall) {
            const nIsRevealed = revealed.has(hexKey(n.q, n.r));
            if (!nIsRevealed && !inPassive) continue;
            // Shore/dock are visible as "land" only when the sub is near the
            // surface. At depth, what was shore from above is just rock —
            // it should render as stone, not land.
            const isLand = (nt.type === 'shore' || nt.type === 'dock')
                         && state.currentDepth <= DEPTH_GRID * 2;
            // Stone: light warm-grey, deliberately not blue. The previous
            // cool grey-blue read too similar to the indigo "water below"
            // tone in dim viewing conditions, leading to mistaken hull
            // collisions when the player thought a wall was open water.
            wallColor = isLand ? '#8a6840' : '#a89a88';
          } else if (!hexAcceptsDepth(nt, state.currentDepth)) {
            // Per the column model: the perimeter cares about three cells
            // in the neighbor column — (q',r',z), (q',r',z-60), and
            // (q',r',z+60). The cell at z is already known to be stone
            // here (hexAcceptsDepth returned false). Now check the two
            // cells one step up and one step down:
            //   cell water at z-60 → cyan (ascend one, then move horizontally)
            //   cell water at z+60 → indigo (descend one, then move)
            //   both → gradient
            //   neither → grey: from the sub's depth, all three cells are
            //             stone, indistinguishable in every actionable way
            //             from a mountain column. Water elsewhere in the
            //             column (a shelf far above, a chamber far below)
            //             is the ping's job to reveal, not the perimeter's.
            const oneUp = state.currentDepth - DEPTH_GRID;
            const oneDown = state.currentDepth + DEPTH_GRID;
            const hasAbove = oneUp >= 0 && cells.has(cellKey(n.q, n.r, oneUp));
            const hasBelow = cells.has(cellKey(n.q, n.r, oneDown));
            if (hasAbove && hasBelow) {
              aboveColor = '#7ed4f0';
              belowColor = '#6048c8';
            } else if (hasAbove) {
              wallColor = '#7ed4f0'; // bright cyan — ascend one step to enter
            } else if (hasBelow) {
              wallColor = '#6048c8'; // indigo — descend one step to enter
            } else {
              wallColor = '#a89a88'; // grey — three stone cells, functionally a wall
            }
          }
          if (!wallColor && !aboveColor && !belowColor) continue;
          const cornerA = (1 - k + 6) % 6;
          const cornerB = (6 - k) % 6;
          const pa = hexCornerPoint(px.x, px.y, HEX_SIZE, cornerA);
          const pb = hexCornerPoint(px.x, px.y, HEX_SIZE, cornerB);
          const strokeW = (1.2 + edgeIntensity * 0.8);
          const op = Math.min(1, alpha + 0.15) * edgeIntensity;
          if (wallColor) {
            // Single-line edge
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', pa.x.toFixed(2));
            line.setAttribute('y1', pa.y.toFixed(2));
            line.setAttribute('x2', pb.x.toFixed(2));
            line.setAttribute('y2', pb.y.toFixed(2));
            line.setAttribute('stroke', wallColor);
            line.setAttribute('stroke-width', strokeW.toFixed(2));
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('opacity', op.toFixed(2));
            line.setAttribute('pointer-events', 'none');
            pendingEdges.push(line);
          } else {
            // Both above and below: gradient runs along the edge's own
            // axis with dark blue at the corners and light blue at the
            // midpoint. Every edge gets the same pattern regardless of
            // its angle, so the hex's perimeter reads as six quiet glows
            // around dark corners — not the spiraling light-to-dark
            // cycle that a screen-anchored vertical gradient produced.
            const gradId = `gradAB_${q}_${r}_${k}`;
            const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
            grad.setAttribute('id', gradId);
            grad.setAttribute('gradientUnits', 'userSpaceOnUse');
            grad.setAttribute('x1', pa.x.toFixed(2));
            grad.setAttribute('y1', pa.y.toFixed(2));
            grad.setAttribute('x2', pb.x.toFixed(2));
            grad.setAttribute('y2', pb.y.toFixed(2));
            grad.innerHTML =
              `<stop offset="0" stop-color="${belowColor}"/>` +
              `<stop offset="0.5" stop-color="${aboveColor}"/>` +
              `<stop offset="1" stop-color="${belowColor}"/>`;
