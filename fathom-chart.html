            defs.appendChild(grad);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', pa.x.toFixed(2));
            line.setAttribute('y1', pa.y.toFixed(2));
            line.setAttribute('x2', pb.x.toFixed(2));
            line.setAttribute('y2', pb.y.toFixed(2));
            line.setAttribute('stroke', `url(#${gradId})`);
            line.setAttribute('stroke-width', strokeW.toFixed(2));
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('opacity', op.toFixed(2));
            line.setAttribute('pointer-events', 'none');
            pendingEdges.push(line);
          }
        }
      }

      // Visited dot marker
      if (isVisited && !tile.poi && !isPlayer) {
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', px.x);
        dot.setAttribute('cy', px.y);
        dot.setAttribute('r', '0.7');
        dot.setAttribute('fill', '#2a5a4a');
        dot.setAttribute('opacity', alpha * 0.6);
        g.appendChild(dot);
      }

      // Tile symbol (POI/feature) — only shown when the tile has water at the
      // current depth. Suppresses deep POIs (gas pocket at 350m) from appearing
      // at the surface just because the initial reveal seeded the tile.
      // Consumed one-shot POIs (air pockets, salvage) stay consumed across
      // reloads: the substrate regenerates the tile, but the overlay
      // (poisFound) knows it was taken — draw plain water, not the prize.
      const consumedPoi = (tile.poi === 'air' || tile.poi === 'salvage') && state.poisFound.includes(key);
      // Ruling: the bottom keeps its secrets. Wreckage resting on the floor is
      // invisible to surface eyes — the glyph is earned by sonar or by having
      // charted near its depth. (Kelp climbs the column; it stays visible.)
      const floorSecret = tile.poi === 'salvage' && !consumedPoi
        && revealFade(tile.q, tile.r, tile.floor) <= 0;
      if (tile.char && !consumedPoi && !floorSecret && hexAcceptsDepth(tile, state.currentDepth)) {
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', px.x);
        txt.setAttribute('y', px.y);
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('dominant-baseline', 'central');
        txt.setAttribute('font-family', 'JetBrains Mono, monospace');
        txt.setAttribute('font-size', tile.poi ? '12' : '10');
        txt.setAttribute('opacity', alpha);
        let color = '#5eb89a';
        if (tile.poi === 'ruin') color = '#d89248';
        else if (tile.poi === 'signal') color = '#b870e8';
        else if (tile.poi === 'growth') color = '#b870e8';
        else if (tile.poi === 'air') color = '#9ee0c2';
        else if (tile.poi === 'salvage') color = '#f4b860';
        else if (tile.poi === 'surface') color = '#f4b860';
        else if (tile.poi === 'opening') color = '#f4b860'; // warm — the way back up
        else if (tile.poi === 'deadend') color = '#3a4858';
        else if (tile.type === 'kelp') color = '#3a6850';
        else if (tile.type === 'current') color = '#4090c8';
        else if (tile.type === 'chasm') color = '#7050a0';
        txt.setAttribute('fill', color);
        if (tile.poi && tile.poi !== 'deadend') txt.setAttribute('filter', 'url(#softglow)');
        txt.textContent = tile.char;
        g.appendChild(txt);

        // Tap-to-identify: invisible hit target over every POI hex. For
        // non-adjacent POIs this is the only interactive element on the hex,
        // so a tap reads the description into the log. For adjacent POIs, the
        // movement hit target (added later in render) sits on top and wins
        // the click — tapping the POI then moves toward it as before.
        if (tile.poi) {
          const hit = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          hit.setAttribute('points', hexCorners(px.x, px.y, HEX_SIZE * 0.7));
          hit.setAttribute('fill', 'rgba(0,0,0,0.001)');
          hit.setAttribute('stroke', 'none');
          hit.style.cursor = 'help';
          hit.addEventListener('click', (e) => {
            e.stopPropagation();
            identifyPoi(tile);
          });
          g.appendChild(hit);
        }
      }

      // Player marker — the Erebus. Adds an arrival pulse when the player just moved.
      if (isPlayer) {
        const now = performance.now();
        const justArrived = (now - (state.lastMoveTime || 0)) < 450;
        const justFailed = (now - (state.lastFailTime || 0)) < 350;

        // Wrap the whole sub in a group so we can shake it as a unit
        const subG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        if (justFailed) subG.classList.add('sub-shake');

        // Outer arrival pulse (only briefly after a successful move)
        if (justArrived && !justFailed) {
          const arr = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          arr.setAttribute('cx', px.x);
          arr.setAttribute('cy', px.y);
          arr.setAttribute('r', HEX_SIZE * 0.7);
          arr.setAttribute('fill', 'none');
          arr.setAttribute('stroke', '#f4b860');
          arr.setAttribute('stroke-width', '0.8');
          arr.setAttribute('opacity', '0.7');
          arr.classList.add('arrival');
          subG.appendChild(arr);
        }

        const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        ring.setAttribute('cx', px.x);
        ring.setAttribute('cy', px.y);
        ring.setAttribute('r', HEX_SIZE * 0.45);
        ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', '#f4b860');
        ring.setAttribute('stroke-width', '1.2');
        ring.setAttribute('filter', 'url(#softglow)');
        subG.appendChild(ring);

        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', px.x);
        dot.setAttribute('cy', px.y);
        dot.setAttribute('r', '2.6');
        dot.setAttribute('fill', '#f4b860');
        dot.setAttribute('filter', 'url(#glow)');
        subG.appendChild(dot);

        g.appendChild(subG);

        // Invisible tap target on the sub's own hex — tapping it issues a "wait"
        const waitHit = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        waitHit.setAttribute('points', hexCorners(px.x, px.y, HEX_SIZE * 0.85));
        waitHit.setAttribute('fill', 'rgba(0,0,0,0.001)');
        waitHit.setAttribute('stroke', 'none');
        waitHit.style.cursor = 'pointer';
        waitHit.addEventListener('click', () => wait());
        g.appendChild(waitHit);
      }
    }
  }

  // Creatures — drawn between fills and edge lines. Only what shares the
  // sub's depth slice, close enough to see; a sleeping lurker is never drawn.
  // Everything else is passive sonar's business.
  for (const c of state.creatures) {
    if (c.depth !== state.currentDepth) continue;
    if (c.type === 'lurker' && !c.awake) continue;
    const dC = hexDistance({q: c.q, r: c.r}, playerHex);
    // Same epistemic rule as terrain: lights touch it (adjacent), or it's
    // inside the passive-sonar envelope AND standing in water the player has
    // actually revealed. No glyphs floating in unexplored void, none through rock.
    if (dC > 1 && (dC > passiveContactR() || revealFade(c.q, c.r, state.currentDepth) <= 0)) continue;
    const cpx = hexToPixel(c.q, c.r);
    if (Math.abs(cpx.x - camX) > halfW || Math.abs(cpx.y - camY) > halfH) continue;
    const ct = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    ct.setAttribute('x', cpx.x);
    ct.setAttribute('y', cpx.y);
    ct.setAttribute('text-anchor', 'middle');
    ct.setAttribute('dominant-baseline', 'central');
    ct.setAttribute('font-family', 'JetBrains Mono, monospace');
    ct.setAttribute('font-size', c.type === 'drifter' ? '14' : c.type === 'eel' ? '11' : '12');
    ct.setAttribute('fill', c.type === 'drifter' ? '#5a8a72' : c.type === 'eel' ? '#c8b040' : c.type === 'rival' ? '#7090b8' : '#d05048');
    ct.setAttribute('filter', 'url(#softglow)');
    ct.textContent = c.type === 'drifter' ? '⊙' : c.type === 'eel' ? '~' : c.type === 'rival' ? '⊘' : '⊗';
    g.appendChild(ct);
  }

  // Flush edge lines last so they always sit on top of all stone/water fills.
  for (const el of pendingEdges) g.appendChild(el);

  // Animated sonar wavefront — expands outward from the sub at ping origin.
  // Two rings: a bright leading edge, and a dimmer trailing one for thickness.
  if (state.ping) {
    const p = state.ping;
    const elapsed = performance.now() - p.startTime;
    const t = Math.min(1, elapsed / p.durationMs);
    const origin = hexToPixel(p.originQ, p.originR);
    const leadRadius = t * p.maxRadiusPx;
    const leadOpacity = (1 - t) * 0.7;
    const lead = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    lead.setAttribute('cx', origin.x);
    lead.setAttribute('cy', origin.y);
    lead.setAttribute('r', leadRadius);
    lead.setAttribute('fill', 'none');
    lead.setAttribute('stroke', '#5eb89a');
    lead.setAttribute('stroke-width', 1.2 + p.power * 0.35);
    lead.setAttribute('opacity', leadOpacity);
    lead.setAttribute('pointer-events', 'none');
    g.appendChild(lead);
    // Trailing fainter ring, lagging slightly behind
    const trailT = Math.max(0, t - 0.12);
    if (trailT > 0) {
      const trailRadius = trailT * p.maxRadiusPx;
      const trailOpacity = (1 - t) * 0.35;
      const trail = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      trail.setAttribute('cx', origin.x);
      trail.setAttribute('cy', origin.y);
      trail.setAttribute('r', trailRadius);
      trail.setAttribute('fill', 'none');
      trail.setAttribute('stroke', '#5eb89a');
      trail.setAttribute('stroke-width', 0.8 + p.power * 0.25);
      trail.setAttribute('opacity', trailOpacity);
      trail.setAttribute('pointer-events', 'none');
      g.appendChild(trail);
    }
    // Inner glow at the sub itself, brightest at ping origin
    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    glow.setAttribute('cx', origin.x);
    glow.setAttribute('cy', origin.y);
    glow.setAttribute('r', HEX_SIZE * 0.6);
    glow.setAttribute('fill', '#5eb89a');
    glow.setAttribute('opacity', (1 - t) * 0.25);
    glow.setAttribute('filter', 'url(#softglow)');
    glow.setAttribute('pointer-events', 'none');
    g.appendChild(glow);
  }

  // Ping arrow overlay — for each revealed hex with an opening above or
  // below the sub's depth (within the ping's depth range), draw a small
  // ↑/↓ marker with the distance in meters. Persists ~4-5 seconds after
  // the wavefront so the player can read at leisure, then fades out.
  if (state.pingArrows) {
    const pa = state.pingArrows;
    const elapsed = performance.now() - pa.startTime;
    if (elapsed >= pa.durationMs) {
      state.pingArrows = null;
    } else {
      // Quick fade in (300ms), long stable middle, fade out over last 800ms
      const fadeIn  = Math.min(1, elapsed / 300);
      const fadeOut = elapsed > (pa.durationMs - 800)
        ? Math.max(0, (pa.durationMs - elapsed) / 800)
        : 1;
      const baseOpacity = fadeIn * fadeOut;
      for (const arrow of pa.arrows) {
        const ap = hexToPixel(arrow.q, arrow.r);
        const isUp = arrow.dir === 'up';
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', ap.x);
        // Stack up/down readouts vertically so both fit when a hex has them.
        txt.setAttribute('y', ap.y + (isUp ? -3.5 : 6.5));
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('dominant-baseline', 'central');
        txt.setAttribute('font-family', 'JetBrains Mono, monospace');
        txt.setAttribute('font-size', '5.5');
        txt.setAttribute('font-weight', '600');
        // Cyan for "ascend to reach", light indigo for "descend to reach"
        // (the dark indigo of the boundary edge is too dim as text).
        txt.setAttribute('fill', isUp ? '#9eddf5' : '#a098e0');
        txt.setAttribute('opacity', baseOpacity);
        txt.setAttribute('pointer-events', 'none');
        txt.textContent = (isUp ? '↑' : '↓') + arrow.meters;
        g.appendChild(txt);
      }
    }
  }

  // Render motion trail — dots fading behind the sub, max 3 steps back.
  // Tells the player at a glance that movement happened and which way.
  // Trail entries from a different depth band are skipped: the player at
  // 360m shouldn't see breadcrumbs from when they were on the surface.
  if (state.trail.length > 0) {
    const subPx = hexToPixel(state.q, state.r);
    let prev = subPx;
    const depthMargin = DEPTH_GRID * 2;
    for (let i = 0; i < state.trail.length; i++) {
      const h = state.trail[i];
      // Skip trail entries whose depth is far from the sub's current depth
      if (h.depth != null && Math.abs(h.depth - state.currentDepth) > depthMargin) {
        prev = hexToPixel(h.q, h.r);
        continue;
      }
      const hp = hexToPixel(h.q, h.r);
      // Brightness decreases with distance from sub
      const alphaSteps = [0.55, 0.30, 0.12];
      const a = alphaSteps[i] || 0.05;
      // Draw a short dotted segment between prev and hp
      const dx = hp.x - prev.x;
      const dy = hp.y - prev.y;
      const len = Math.sqrt(dx*dx + dy*dy);
      const steps = 4;
      for (let s = 1; s < steps; s++) {
        const t = s / steps;
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', prev.x + dx * t);
        dot.setAttribute('cy', prev.y + dy * t);
        dot.setAttribute('r', '1.0');
        dot.setAttribute('fill', '#f4b860');
        dot.setAttribute('opacity', a * (1 - t * 0.25));
        dot.setAttribute('pointer-events', 'none');
        g.appendChild(dot);
      }
      prev = hp;
    }
  }

  // Render failed-move flash on top of normal tiles
  if (state.failHex && performance.now() < state.failHex.expires) {
    const fpx = hexToPixel(state.failHex.q, state.failHex.r);
    const flash = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    flash.setAttribute('points', hexCorners(fpx.x, fpx.y, HEX_SIZE * 0.96));
    flash.setAttribute('fill', state.failHex.color);
    flash.setAttribute('opacity', '0');
    flash.setAttribute('stroke', state.failHex.color);
    flash.setAttribute('stroke-width', '1.6');
    flash.classList.add('move-flash');
    g.appendChild(flash);
  }

  // Tap-to-move hit areas on adjacent passable tiles
  const adj = hexNeighbors(state.q, state.r);
  for (const n of adj) {
    const tile = tileAt(n.q, n.r);
    const px = hexToPixel(n.q, n.r);

    if (tile.wall) {
      // Invisible tap target on adjacent walls — collision damage if tapped.
      // Slightly inset so it doesn't fight with the player's own hex.
      const hit = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      hit.setAttribute('points', hexCorners(px.x, px.y, HEX_SIZE * 0.85));
      hit.setAttribute('fill', 'rgba(0,0,0,0.001)'); // invisible but tappable
      hit.setAttribute('stroke', 'none');
      hit.style.cursor = 'not-allowed';
      hit.addEventListener('click', () => move(n.q, n.r));
      g.appendChild(hit);
      continue;
    }

    revealAt(n.q, n.r, state.currentDepth);
    // Reachable hexes get a visible dashed tap target. Depth-locked open
    // hexes get an invisible tap target — tapping them is a collision
    // attempt (the sub strikes rock at the current depth) and feeds back
    // sonar info about the opening above or below. Walls already handled
    // above.
    const reachable = hexAcceptsDepth(tile, state.currentDepth);
    if (reachable) {
      const hit = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      hit.setAttribute('points', hexCorners(px.x, px.y, HEX_SIZE * 0.95));
      hit.setAttribute('fill', 'rgba(94,184,154,0.04)');
      hit.setAttribute('stroke', 'rgba(94,184,154,0.55)');
      hit.setAttribute('stroke-width', '0.8');
      hit.setAttribute('stroke-dasharray', '2 2');
      hit.style.cursor = 'pointer';
      hit.addEventListener('click', () => move(n.q, n.r));
      g.appendChild(hit);
    } else {
      // Depth-locked: invisible but tappable. Collision behavior in move().
      const hit = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      hit.setAttribute('points', hexCorners(px.x, px.y, HEX_SIZE * 0.85));
      hit.setAttribute('fill', 'rgba(0,0,0,0.001)');
      hit.setAttribute('stroke', 'none');
      hit.style.cursor = 'not-allowed';
      hit.addEventListener('click', () => move(n.q, n.r));
      g.appendChild(hit);
    }
  }

  // Vignette overlay (in svg viewport space, not world space)
  const vignette = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  const vw = viewW / zoom, vh = viewH / zoom;
  vignette.setAttribute('x', -vw/2);
  vignette.setAttribute('y', -vh/2);
  vignette.setAttribute('width', vw);
  vignette.setAttribute('height', vh);
  vignette.setAttribute('fill', 'url(#vignette)');
  vignette.setAttribute('pointer-events', 'none');
  svg.appendChild(vignette);
}

//=============================================================================
// REVEAL & EXPLORATION
//=============================================================================

// Store a depth-tagged reveal event. depth is snapped to DEPTH_GRID.
function revealAt(q, r, depth) {
  const k = hexKey(q, r);
  const snapped = Math.round(depth / DEPTH_GRID) * DEPTH_GRID;
  if (!revealed.has(k)) revealed.set(k, new Set());
  revealed.get(k).add(snapped);
}

// Returns 0..1 alpha factor for a water tile at (q,r) viewed from currentDepth.
// Fades linearly to 0 over 3 DEPTH_GRID steps (180 m). 0 = render as void.
function revealFade(q, r, currentDepth) {
  const depths = revealed.get(hexKey(q, r));
  if (!depths) return 0;
  let minDist = Infinity;
  for (const z of depths) minDist = Math.min(minDist, Math.abs(z - currentDepth));
  const maxDist = 3 * DEPTH_GRID;
  if (minDist >= maxDist) return 0;
  return 1 - minDist / maxDist;
}

function revealAround(q, r, radius) {
  const depth = state.currentDepth;
  revealAt(q, r, depth);
  for (let dq = -radius; dq <= radius; dq++) {
    for (let dr = Math.max(-radius, -dq-radius); dr <= Math.min(radius, -dq+radius); dr++) {
      revealAt(q + dq, r + dr, depth);
    }
  }
}

// Sonar model. Passive sonar is constant — always on, free, fixed range —
// and is independent of the slider. The slider only selects the power of
// the ACTIVE ping (button-triggered, air-cost, broadcasts a wavefront).
//
//   activeRange: hexes the ping reaches outward
//   depthRange:  meters of depth ± current depth the ping reads through
//                (controls how far up/down the arrow overlay sees openings)
//   activeCost:  air cost per ping at this level
//   loudness:    forward-looking — pings carry; loud pings attract creatures
//                and enemy contact. Stored for future combat/AI hookups.
//
// Curve rationale: range and cost grow faster than linearly with power.
// Power 1 is the "right here" ping; nav lives at 2-3; high power (4-5) is
// the survey-the-room ping for scouting, with real air commitment.
// One hex = 60 meters.
const PASSIVE_RANGE = 1; // always-on; sub sees the hex it's in plus adjacent
const PING_LEVELS = [
  { activeRange: 0,  depthRange: 0,   activeCost: 0,  loudness: 0 }, // 0: silent
  { activeRange: 1,  depthRange: 60,  activeCost: 1,  loudness: 1 }, // 1: right here
  { activeRange: 3,  depthRange: 180, activeCost: 3,  loudness: 2 }, // 2: nav
  { activeRange: 5,  depthRange: 360, activeCost: 6,  loudness: 3 }, // 3: mid
  { activeRange: 8,  depthRange: 540, activeCost: 10, loudness: 4 }, // 4: long
  { activeRange: 12, depthRange: 720, activeCost: 15, loudness: 5 }, // 5: survey
];

function pingPower() {
  const el = document.getElementById('ping-power');
  return el ? parseInt(el.value, 10) : 2;
}

function passiveRange() {
  // Passive sonar is fixed — the slider does not affect it.
  return PASSIVE_RANGE;
}

function updatePingDisplay() {
  const p = pingPower();
  const lvl = PING_LEVELS[p];
  const costEl = document.getElementById('ping-cost');
  const rangeEl = document.getElementById('ping-range');
  if (p === 0) {
    if (costEl) costEl.textContent = 'OFF';
    if (rangeEl) rangeEl.textContent = 'silent';
  } else {
    if (costEl) costEl.textContent = lvl.activeCost;
    if (rangeEl) rangeEl.textContent = lvl.activeRange * 60;
  }
  // Disable the Ping button when sonar is set to silent
  const pingBtn = document.getElementById('btn-ping');
  if (pingBtn) pingBtn.disabled = (p === 0);
  // Re-render is unnecessary now that passive is decoupled — slider position
  // doesn't change the chart until the user actually fires a ping.
}

// Hex line algorithm — returns a list of hexes on the line from a to b.
// Uses cube-coord lerp + round.
function hexLine(a, b) {
  const N = hexDistance(a, b);
  if (N === 0) return [a];
  const out = [];
  // Cube coords: x=q, z=r, y=-q-r
  const ax = a.q, az = a.r, ay = -a.q - a.r;
  const bx = b.q, bz = b.r, by = -b.q - b.r;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = ax + (bx - ax) * t;
    const z = az + (bz - az) * t;
    const y = ay + (by - ay) * t;
    // round to nearest cube hex
    let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
    const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
    if (dx > dy && dx > dz) rx = -ry - rz;
    else if (dy > dz) ry = -rx - rz;
    else rz = -rx - ry;
    out.push({ q: rx, r: rz });
  }
  return out;
}

// RAF-driven sonar wavefront. Each tick re-renders so the wavefront appears
// to expand smoothly outward from the sub. Clears state.ping when finished.
function animatePing() {
  const now = performance.now();
  // Keep animating while either the wavefront OR the arrow overlay needs to
  // be redrawn. They have different durations, so we drive both from here.
  const pingActive = state.ping && (now - state.ping.startTime) < state.ping.durationMs;
  const arrowsActive = state.pingArrows && (now - state.pingArrows.startTime) < state.pingArrows.durationMs;
  if (!pingActive && !arrowsActive) {
    if (state.ping) state.ping = null;
    if (state.pingArrows) state.pingArrows = null;
    render();
    return;
  }
  if (!pingActive && state.ping) state.ping = null;
  render();
  requestAnimationFrame(animatePing);
}

function ping() {
  const power = pingPower();
  if (power === 0) {
    log('Sonar is silent.', 'warn');
    return;
  }
  const lvl = PING_LEVELS[power];
  if (state.air < lvl.activeCost) {
    log(`Not enough air for a power-${power} ping. Needs ${lvl.activeCost}.`, 'warn');
    return;
  }
  state.air = Math.max(0, state.air - lvl.activeCost);
  // A ping is a shout in a dark house. Everything with ears now knows where you are.
  noiseMade(state.q, state.r, lvl.loudness);
  sfx('ping');

  const radius = lvl.activeRange;
  let interesting = null;
  let interestingDist = 999;
  let openHexes = 0;
  let totalHexes = 0;

  // Build the set of revealed hexes via line-of-sight rays.
  // For every hex on the ring at exact distance == radius, cast a ray from
  // the sub through that hex; reveal every hex along the ray up to and
  // including the first wall, then stop. This naturally produces shadows
  // behind walls.
  const ringHexes = [];
  for (let dq = -radius; dq <= radius; dq++) {
    for (let dr = Math.max(-radius, -dq-radius); dr <= Math.min(radius, -dq+radius); dr++) {
      const q = state.q + dq, r = state.r + dr;
      const d = hexDistance({q, r}, {q: state.q, r: state.r});
      if (d === radius) ringHexes.push({q, r});
    }
  }

  const pingRevealed = new Set();
  for (const target of ringHexes) {
    const line = hexLine({q: state.q, r: state.r}, target);
    for (let i = 0; i < line.length; i++) {
      const p = line[i];
      const k = hexKey(p.q, p.r);
      const tile = tileAt(p.q, p.r);
      pingRevealed.add(k);
      // A face that is rock AT THIS DEPTH stops sound like full-column stone —
      // rays must not chart labyrinth behind a wall they struck. The face
      // itself stays revealed (added above): that's the sanctioned knowledge.
      if (tile.wall || !hexAcceptsDepth(tile, state.currentDepth)) {
        // Wall is the last hex revealed along this ray.
        break;
      }
    }
  }

  // Record the ping memory — every revealed hex gets a freshness counter
  // that ticks down each turn. While > 0, its wall edges remain visible
  // even if passive sonar wouldn't normally reach it.
  const PING_MEMORY_TURNS = 5;
  for (const k of pingRevealed) {
    state.pingMemory.set(k, PING_MEMORY_TURNS);
  }

  // Stats and POI search across only the line-of-sight revealed set.
  // Also build the arrow overlay: for every revealed hex that's not
  // reachable in one step, find the nearest opening above and below
  // (within the ping's depth range) and queue a small ↑/↓ readout for
  // the render loop to draw on that hex.
  const depthRange = lvl.depthRange;
  const pingArrowList = [];
  for (const k of pingRevealed) {
    const [q, r] = k.split(',').map(Number);
    const tile = tileAt(q, r);
    revealAt(q, r, state.currentDepth);
    totalHexes++;
    if (!tile.wall) openHexes++;
    const d = hexDistance({q, r}, {q: state.q, r: state.r});
    const poiConsumed = (tile.poi === 'air' || tile.poi === 'salvage') && state.poisFound.includes(k);
    if (tile.poi && !poiConsumed && d > 1) {
      if (d < interestingDist) {
        interesting = tile;
        interestingDist = d;
      }
    }
    // Arrow overlay: skip the sub's own hex, walls, and hexes already
    // reachable horizontally at current depth.
    if (tile.wall) continue;
    if (q === state.q && r === state.r) continue;
    if (hexAcceptsDepth(tile, state.currentDepth)) continue;
    // Nearest open cell above / below the sub's depth, within the ping's
    // vertical reach. (cd itself is stone here — we continue'd past reachable.)
    let nearestAbove = null, nearestBelow = null;
    for (let dist = DEPTH_GRID; dist <= depthRange; dist += DEPTH_GRID) {
      const up = state.currentDepth - dist;
      if (nearestAbove === null && up >= 0 && cells.has(cellKey(q, r, up))) nearestAbove = dist;
      const dn = state.currentDepth + dist;
      if (nearestBelow === null && cells.has(cellKey(q, r, dn))) nearestBelow = dist;
      if (nearestAbove !== null && nearestBelow !== null) break;
    }
    if (nearestAbove !== null) pingArrowList.push({ q, r, dir: 'up', meters: nearestAbove });
    if (nearestBelow !== null) pingArrowList.push({ q, r, dir: 'down', meters: nearestBelow });
  }

  // Start an animated wavefront — radius grows from 0 to the ping's actual reach
  // over a duration scaled by power. The render loop draws it from state.ping.
  const maxRadiusPx = radius * HEX_SIZE * SQRT3;
  const durationMs = 700 + power * 220;
  state.ping = {
    startTime: performance.now(),
    durationMs,
    maxRadiusPx,
    originQ: state.q,
    originR: state.r,
    power,
  };
  // Arrow overlay persists longer than the wavefront so the player has time
  // to read distances. Stronger pings reveal more detail for longer.
  if (pingArrowList.length > 0) {
    state.pingArrows = {
      arrows: pingArrowList,
      startTime: performance.now(),
      durationMs: 3500 + power * 400, // 3.9s at p1, 5.5s at p5
    };
  }
  animatePing();

  // Compose the log message
  const openRatio = openHexes / Math.max(1, totalHexes);

  const atSurface = state.currentDepth <= 1;

  if (interesting) {
    const dir = bearing(state.q, state.r, interesting.q, interesting.r);
    const meters = interestingDist * 60;
    // Depth offset to the POI: find the nearest volume in the POI tile and compare
    let depthHint = '';
    const near = nearestVolume(interesting, state.currentDepth);
    if (near && near.deltaMeters > 8 && near.deltaMeters <= lvl.depthRange) {
      const dir2 = near.volume.ceiling > state.currentDepth ? 'below' : 'above';
      depthHint = `, ${Math.round(near.deltaMeters)} m ${dir2}`;
    }
    const echo = (interesting.poi === 'growth' || interesting.poi === 'signal') ? 'STRANGE'
               : (interesting.poi === 'air') ? 'AIR'
               : (interesting.poi === 'opening') ? 'OPENING'
               : 'ECHO';
    const echoClass = (echo === 'STRANGE') ? 'strange' : (echo === 'AIR' ? 'warn' : '');
    log(`${interesting.name.charAt(0).toUpperCase() + interesting.name.slice(1)} ${dir}, ${meters} m out${depthHint}.`, echoClass, echo);
  } else if (atSurface) {
    // Surface pings detect bottom contours and openings — no walls up here.
    if (power >= 4) {
      log('The ping ranges out across the shelf. Nothing breaks the seafloor in earshot.', '', 'ECHO');
    } else if (power >= 3) {
      log('The ping fans through the water column. Empty.', '', 'ECHO');
    } else {
      log('The ping fades into open water.', '', 'ECHO');
    }
  } else if (power >= 3 && openRatio < 0.15) {
    log('The ping returns from stone in every direction. You are alone in a corridor.', '', 'ECHO');
  } else if (power >= 4 && openRatio > 0.6) {
    log('The ping travels far. Open water in every direction. The hull feels small.', 'strange', 'ECHO');
  } else if (power >= 3 && openRatio > 0.35) {
    log('The ping opens. Wide spaces nearby.', '', 'ECHO');
  } else {
    log('The ping returns only stone.', '', 'ECHO');
  }

  creatureTick();
  updateHUD();
  render();
}

function bearing(fromQ, fromR, toQ, toR) {
  const a = hexToPixel(fromQ, fromR);
  const b = hexToPixel(toQ, toR);
  const angle = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  // 0 = east, 90 = south, -90 = north
  if (angle > -22.5 && angle <= 22.5) return 'east';
  if (angle > 22.5 && angle <= 67.5) return 'southeast';
  if (angle > 67.5 && angle <= 112.5) return 'south';
  if (angle > 112.5 && angle <= 157.5) return 'southwest';
  if (angle > 157.5 || angle <= -157.5) return 'west';
  if (angle > -157.5 && angle <= -112.5) return 'northwest';
  if (angle > -112.5 && angle <= -67.5) return 'north';
  return 'northeast';
}

//=============================================================================
// MOVEMENT
//=============================================================================

// Flag a failed move attempt so the renderer can flash the target hex and
// shake the sub. Color picks the flash hue based on what blocked the move.
function flagMoveFail(q, r, color) {
  state.failHex = { q, r, color, expires: performance.now() + 550 };
  state.lastFailTime = performance.now();
  render();
  // Auto-clear after the flash so it doesn't linger on subsequent renders
  setTimeout(() => {
    if (state.failHex && performance.now() >= state.failHex.expires) {
      state.failHex = null;
      render();
    }
  }, 600);
}

// Wait — a passive turn. The boat holds station. Air is consumed (or recovered)
// per the current depth, and an ambient flavor line fires occasionally.
function wait() {
  if (!state.alive) return;
  state.moves++;
  state.lastMoveTime = performance.now();
  tickPingMemory();
  applyMoveCosts(1);
  // Re-fire ambient flavor at the current tile so the player gets a sense of
  // time passing rather than silence.
  const tile = getTile(state.q, state.r);
  if (tile && rand() < 0.6) handleTile(tile);
  creatureTick();
  checkDeath();
  updateHUD();
  render();
}

function move(q, r) {
  if (!state.alive) return;
  const tile = tileAt(q, r);
  // Only allow attempted moves to actual adjacent hexes
  if (hexDistance({q, r}, {q: state.q, r: state.r}) !== 1) return;

  if (tile.wall) {
    // Collision — the sub strikes the rock
    const dmg = 4 + Math.floor(rand() * 5); // 4-8 hull damage
    state.hull = Math.max(0, state.hull - dmg);
    state.lastMoveTime = performance.now();
    log(`The hull strikes rock. No passage there. -${dmg} hull.`, 'danger', 'IMPACT');
    flagMoveFail(q, r, '#a04030');
    noiseMade(q, r, 2); // metal on rock carries — hunters hear it
    sfx('impact');
    creatureTick();
    checkDeath();
    updateHUD();
    return;
  }

  // Depth gate: the neighbor hex must have a volume containing our current depth
  if (!hexAcceptsDepth(tile, state.currentDepth)) {
    // Striking rock at this depth — the water in that hex is above or below
    // the sub, so swimming horizontally drives into stone. Damage applies,
    // and the sonar reports which direction has the opening.
    const dmg = 4 + Math.floor(rand() * 5);
    state.hull = Math.max(0, state.hull - dmg);
    state.lastMoveTime = performance.now();
    const near = nearestVolume(tile, state.currentDepth);
    if (near && near.deltaMeters > 0 && near.deltaMeters <= PING_LEVELS[activeSub().sonarMaxPower].depthRange) {
      const delta = Math.max(1, Math.round(near.deltaMeters));
      const dir = near.volume.ceiling > state.currentDepth ? 'below' : 'above';
      log(`The hull strikes rock. Sonar reads an opening ${delta} m ${dir}. -${dmg} hull.`, 'danger', 'IMPACT');
    } else {
      log(`The hull strikes rock. No passage at this depth. -${dmg} hull.`, 'danger', 'IMPACT');
    }
    flagMoveFail(q, r, '#a04030');
    noiseMade(q, r, 2); // metal on rock carries — hunters hear it
    sfx('impact');
    creatureTick();
    checkDeath();
    updateHUD();
    return;
  }

  // A living body in the water: you don't share a hex with a big one.
  // Small things (eels) just whip aside under the hull.
  const blocker = state.creatures.find(c =>
    c.q === q && c.r === r && Math.abs(c.depth - state.currentDepth) < DEPTH_GRID);
  if (blocker && blocker.type !== 'eel') {
    state.lastMoveTime = performance.now();
    log(blocker.type === 'drifter'
      ? 'Something vast fills the passage, drifting. The boat backs off.'
      : blocker.type === 'rival'
      ? "Another boat holds that water and won't yield. You back off."
      : 'Something is in that water. The boat backs off.', 'warn', 'CONTACT');
    flagMoveFail(q, r, '#7050a0');
    creatureTick();
    updateHUD();
    return;
  }
  if (blocker) {
    const dodge = hexNeighbors(q, r).filter(n =>
      creatureCanEnter(blocker, n.q, n.r, blocker.depth) && !(n.q === state.q && n.r === state.r));
    if (dodge.length) {
      const n2 = dodge[Math.floor(rand() * dodge.length)];
      blocker.q = n2.q; blocker.r = n2.r;
    }
    if (rand() < 0.6) log('Something small whips aside under the hull.', '', 'CONTACT');
  }

  // Trail: remember the hex we just left, newest first, cap at 3. Depth is
  // recorded so that when the sub descends, trail dots from a different
  // depth band fade out of view (they belong to a different "layer" of the
  // world).
  state.trail.unshift({ q: state.q, r: state.r, depth: state.currentDepth });
  if (state.trail.length > 3) state.trail.length = 3;

  state.q = q;
  state.r = r;
  state.moves++;
  state.lastMoveTime = performance.now();
  state.failHex = null;
  state.pingArrows = null; // arrows are a snapshot — stale after a move
  tickPingMemory();
  // Decay any user pan when the player moves, so the camera re-follows the sub
  state.panX *= 0.5;
  state.panY *= 0.5;
  if (Math.abs(state.panX) < 2) state.panX = 0;
  if (Math.abs(state.panY) < 2) state.panY = 0;

  applyMoveCosts(tile.cost);

  // Zone transition detection — log when player crosses a geographic boundary
  detectZoneTransition(q, r);

  // Reveal
  visited.add(hexKey(q, r));
  revealAt(q, r, state.currentDepth);
  for (const n of hexNeighbors(q, r)) {
    revealAt(n.q, n.r, state.currentDepth);
  }

  // React to tile
  handleTile(tile);

  // Z-axis context — if the new hex has significant vertical space, sound it out.
  const curVol = volumeContaining(tile, state.currentDepth);
  if (curVol && (curVol.floor - curVol.ceiling) >= 100) {
    logZContext(tile, curVol);
  }

  // The water answers: creatures take their turn, then death checks.
  creatureTick();
  checkDeath();

  updateHUD();
  render();
  schedulePregen();
}

// Idle-time chunk pregeneration. tileAt already forces the 3x3 chunk block
// around anything rendered; this quietly extends generation one ring further
// (the 5x5 rim) during idle moments, one chunk per tick, so the player never
// feels a generation hitch when crossing a chunk boundary. ensureChunk no-ops
// on anything already generated, so re-scheduling is nearly free.
let pregenQueue = [];
let pregenTimer = 0;
function schedulePregen() {
  const { cq, cr } = hexToChunk(state.q, state.r);
  pregenQueue = [];
  for (let dq = -2; dq <= 2; dq++) {
    for (let dr = -2; dr <= 2; dr++) {
      if (Math.max(Math.abs(dq), Math.abs(dr)) === 2) pregenQueue.push([cq + dq, cr + dr]);
    }
  }
  if (!pregenTimer) pregenTimer = setTimeout(pregenTick, 80);
}
function pregenTick() {
  pregenTimer = 0;
  const next = pregenQueue.shift();
  if (!next) return;
  ensureChunk(next[0], next[1]);
  if (pregenQueue.length) pregenTimer = setTimeout(pregenTick, 80);
}

//=============================================================================
// SOUND — a voice for the deep. Everything synthesized in WebAudio: no
// assets, no dependencies. Wrapped so a missing/blocked AudioContext can
// never break the game — sfx() is always a safe no-op. The context unlocks
// on the first user-gesture-driven sound (Android autoplay policy).
//=============================================================================

let audioCtx = null;
let audioMaster = null;
let audioMuted = false;
try { audioMuted = localStorage.getItem('fathom-audio') === '0'; } catch (e) {}

function audioEnsure() {
  if (audioMuted) return null;
  if (!audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      audioMaster = audioCtx.createGain();
      audioMaster.gain.value = 0.22;
      audioMaster.connect(audioCtx.destination);
    } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}

function tone(freqFrom, freqTo, dur, type, vol, delay) {
  const ctx = audioEnsure();
  if (!ctx) return;
  const t0 = ctx.currentTime + (delay || 0);
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freqFrom, t0);
  if (freqTo && freqTo !== freqFrom) osc.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.5, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g);
  g.connect(audioMaster);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

function noiseBurst(dur, vol, cutoff) {
  const ctx = audioEnsure();
  if (!ctx) return;
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = cutoff || 300;
  const g = ctx.createGain();
  g.gain.value = vol || 0.5;
  src.connect(filt);
  filt.connect(g);
  g.connect(audioMaster);
  src.start(ctx.currentTime);
}

const SFX = {
  ping()    { tone(1250, 320, 0.7, 'sine', 0.5); },                                  // the signature sweep
  impact()  { noiseBurst(0.18, 0.6, 250); tone(90, 55, 0.22, 'sine', 0.5); },        // hull on rock
  groan()   { tone(52, 38, 1.4, 'sawtooth', 0.16); tone(66, 47, 1.1, 'sawtooth', 0.10, 0.15); }, // pressure
  ballast() { noiseBurst(0.5, 0.4, 180); },                                          // tanks blowing
  strike()  { noiseBurst(0.25, 0.8, 200); tone(70, 45, 0.3, 'sine', 0.6); },         // something hits back
  theft()   { tone(900, 1400, 0.08, 'square', 0.18); tone(1400, 700, 0.10, 'square', 0.15, 0.09); },
  bell()    { tone(660, 660, 0.5, 'sine', 0.25); tone(1320, 1320, 0.4, 'sine', 0.10, 0.01); },   // port money
  relic()   { tone(520, 780, 0.25, 'triangle', 0.2); tone(780, 1040, 0.3, 'triangle', 0.16, 0.22); },
  contact() { tone(220, 210, 0.15, 'sine', 0.12); },                                 // passive pip
};
function sfx(name) { try { if (SFX[name]) SFX[name](); } catch (e) {} }

//=============================================================================
// EXPEDITIONS — the crew goes over the side.
//
// Ruins and signals are worked by dive teams: the boat holds station while
// divers explore below, one event per player turn. Crates and RELICS come up
// the line; moving off recalls the team with whatever they carry. The site is
// spent either way. Creatures keep ticking while you wait — holding station
// in the dark with divers down is the loneliest air in the game.
//=============================================================================

function startExpedition(tile, kind) {
  state.expedition = {
    key: hexKey(tile.q, tile.r),
    type: kind,
    turns: 4 + randInt(3),
    crates: 0,
    relics: 0,
  };
  log(kind === 'ruin'
    ? 'The boat holds station over the ruin. Two divers go over the side, lights dropping away into the structure.'
    : 'The boat holds station on the signal. A diver goes over the side, homing on the pulse.', '', 'DIVE TEAM');
}

function expeditionTick() {
  const exp = state.expedition;
  if (!exp) return;
  if (hexKey(state.q, state.r) !== exp.key) {
    finishExpedition('The dive team is recalled, hauled in on the line');
    return;
  }
  exp.turns--;
  const roll = rand();
  const relicChance = exp.type === 'signal' ? 0.20 : 0.10;
  if (roll < relicChance) {
    exp.relics++;
    log('The divers surface a RELIC — old work, and not drowned-men make.', 'strange', 'RELIC');
    sfx('relic');
  } else if (roll < relicChance + 0.35) {
    exp.crates++;
    log('The divers send up a crate on the line.', '', 'DIVE TEAM');
  } else if (roll < relicChance + 0.50) {
    const dmg = 2 + randInt(3);
    state.hull = Math.max(0, state.hull - dmg);
    log(`Something shifts below — the line snags and saws the hull. -${dmg} hull.`, 'warn', 'DIVE TEAM');
  } else if (roll < relicChance + 0.60) {
    state.air = Math.min(activeSub().air, state.air + 8);
    log('The divers tap a trapped pocket and pass gas up the line. +8 air.', '', 'DIVE TEAM');
  } else {
    log(pick([
      'Hand signals on the line: still searching.',
      'The divers report voices below. There are no voices.',
      'Silt blooms under the boat. The lights dim, then steady.',
    ]), '', 'DIVE TEAM');
  }
  if (exp.turns <= 0) finishExpedition('The divers come up on the last of their air');
}

function finishExpedition(prefix) {
  const exp = state.expedition;
  if (!exp) return;
  state.expedition = null;
  state.cargo += exp.crates;
  state.relics += exp.relics;
  if (!state.poisFound.includes(exp.key)) state.poisFound.push(exp.key);
  const hauls = [];
  if (exp.crates) hauls.push(`${exp.crates} crate${exp.crates > 1 ? 's' : ''}`);
  if (exp.relics) hauls.push(`${exp.relics} relic${exp.relics > 1 ? 's' : ''}`);
  log(`${prefix}${hauls.length ? ' with ' + hauls.join(' and ') : ', empty-handed'}. The site is worked out.`, '', 'DIVE TEAM');
}

//=============================================================================
// CREATURES — the deep is inhabited.
//
// Creatures are OVERLAY, not substrate: rolled once per chunk (spawnedChunks,
// saved), living in state.creatures, acting one step after each player turn.
// They move only through open cells — the same voxel truth the sub obeys.
//   drifter — vast, slow, harmless; wanders the caves and fills the passage
//             it occupies. You go around, or you wait.
//   lurker  — a sound-hunter. Sleeps until a loud noise (active ping, hull
//             impact) wakes it; then it comes, aligning depth first, and
//             strikes whatever it corners. Silence is armor.
//=============================================================================

const CREATURE_SIM_RANGE = 24; // hexes — beyond this, creatures rest in the dark
const CONTACT_LOG_MS = 7000;   // min ms between passive-contact log lines
// Sound envelopes: coarser information carries farther. The passive ear
// LOCALIZES (bearing + range) to passiveContactR; a woken hunter's first stir
// is merely NOTICED (one unlocalized bit) out to wakeNoticeR.
function passiveContactR() { return passiveRange() + 2; }
function wakeNoticeR() { return passiveRange() + 6; }

function spawnCreature(type, q, r, depth) {
  state.creatures.push({
    id: type + ':' + q + ',' + r + ',' + depth,
    type, q, r, depth,
    awake: false, tq: 0, tr: 0, calm: 0, phase: 0,
  });
}

// A creature may enter any open cell except the sub's own — hunters stop
// adjacent; the strike happens from there.
function creatureCanEnter(c, q, r, depth) {
  if (q === state.q && r === state.r && depth === state.currentDepth) return false;
  return cells.has(cellKey(q, r, depth));
}

// Sound in the water. Loudness comes from PING_LEVELS (1-5) or a hull impact
// (2). Every sleeping lurker in earshot wakes and turns toward the source.
function noiseMade(q, r, loudness) {
  if (!loudness) return;
  const reach = 2 + loudness * 3;
  for (const c of state.creatures) {
    if (c.type !== 'lurker') continue;
    if (Math.abs(c.depth - state.currentDepth) > 2 * DEPTH_GRID) continue;
    const d = hexDistance({q: c.q, r: c.r}, {q, r});
    if (d > reach) continue;
    const first = !c.awake;
    c.awake = true; c.tq = q; c.tr = r; c.calm = 9;
    if (first && d <= wakeNoticeR()) {
      log('Passive sonar: something answers the noise. It is moving.', 'danger', 'CONTACT');
    }
  }
}

// How open is the water here? Tight cells (1-2 open neighbors) are where
// small things go to ground — the first taste of size-class gameplay.
function openNeighborCount(q, r, d) {
  let n = 0;
  for (const nb of hexNeighbors(q, r)) if (cells.has(cellKey(nb.q, nb.r, d))) n++;
  return n;
}

// The eel: small, fast, and a thief. It smells a laden hold, raids a crate
// from alongside, then flees into the tightest water it can find. Corner it
// and it panics, drops the crate, and is gone. Uncaught, crate and eel both
// vanish into cracks no boat can follow.
function tickEel(c, dPlayer) {
  const sameSlice = Math.abs(c.depth - state.currentDepth) < DEPTH_GRID;
  if (c.carrying && dPlayer === 1 && sameSlice) {
    state.cargo++;
    c.gone = true;
    log('Cornered! The thief convulses, drops the crate, and is gone into a crack.', '', 'RECOVERED');
    sfx('bell');
    return;
  }
  if (c.carrying) {
    c.flee--;
    if (c.flee <= 0) { c.gone = true; return; }
    let best = null, bestScore = Infinity;
    for (const n of hexNeighbors(c.q, c.r)) {
      if (!creatureCanEnter(c, n.q, n.r, c.depth)) continue;
      // Prefer tight water first, distance from the boat second.
      const score = openNeighborCount(n.q, n.r, c.depth) * 10
                  - hexDistance({q: n.q, r: n.r}, {q: state.q, r: state.r});
      if (score < bestScore) { bestScore = score; best = n; }
    }
    if (best) { c.q = best.q; c.r = best.r; }
    return;
  }
  if (state.cargo > 0 && dPlayer <= 8 && Math.abs(c.depth - state.currentDepth) <= 2 * DEPTH_GRID) {
    // Hungry, and it is FAST — two moves a turn.
    for (let step = 0; step < 2; step++) {
      const dNow = hexDistance({q: c.q, r: c.r}, {q: state.q, r: state.r});
      if (dNow === 1 && Math.abs(c.depth - state.currentDepth) < DEPTH_GRID) {
        state.cargo--;
        c.carrying = 1;
        c.flee = 12;
        log('Something quick raids the hold — a crate is gone into the dark!', 'danger', 'THEFT');
        sfx('theft');
        return;
      }
      if (c.depth !== state.currentDepth) {
        const dd = state.currentDepth > c.depth ? DEPTH_GRID : -DEPTH_GRID;
        if (c.depth + dd >= 0 && cells.has(cellKey(c.q, c.r, c.depth + dd))) { c.depth += dd; continue; }
      }
      let best = null, bestD = dNow;
      for (const n of hexNeighbors(c.q, c.r)) {
        if (!creatureCanEnter(c, n.q, n.r, c.depth)) continue;
        const d2 = hexDistance({q: n.q, r: n.r}, {q: state.q, r: state.r});
        if (d2 < bestD) { bestD = d2; best = n; }
      }
      if (best) { c.q = best.q; c.r = best.r; } else break;
    }
    return;
  }
  if (rand() < 0.5) {
    const nbrs = hexNeighbors(c.q, c.r).filter(n => creatureCanEnter(c, n.q, n.r, c.depth));
    if (nbrs.length) { const n = nbrs[Math.floor(rand() * nbrs.length)]; c.q = n.q; c.r = n.r; }
  }
}

// A rival salvager: another boat, working the same waters. It seeks the
// nearest unworked site, holds station three turns with divers down, and
// strips it — the prize is gone before you arrive. It wants no trouble:
// close on it and it stands off. Every encounter should feel like an event.
function tickRival(c, dPlayer) {
  if (dPlayer <= 2) {
    // Wary of company — open the range.
    let best = null, bestD = dPlayer;
    for (const n of hexNeighbors(c.q, c.r)) {
      if (!creatureCanEnter(c, n.q, n.r, c.depth)) continue;
      const d2 = hexDistance({q: n.q, r: n.r}, {q: state.q, r: state.r});
      if (d2 > bestD) { bestD = d2; best = n; }
    }
    if (best) { c.q = best.q; c.r = best.r; }
    return;
  }
  if (c.working) {
    c.work--;
    if (c.work <= 0) {
      c.working = 0;
      if (c.tk && !state.poisFound.includes(c.tk)) state.poisFound.push(c.tk);
      c.tk = null;
      if (dPlayer <= passiveContactR() + 4) {
        log("Across the water: another boat's divers surface. They got there first.", 'warn', 'RIVAL');
      }
    }
    return;
  }
  // Acquire a target every few turns: the nearest unworked site.
  c.phase = (c.phase + 1) % 6;
  if (!c.tk && c.phase === 0) {
    let best = null, bestD = 15;
    for (const [k, t] of world) {
      if (!t.poi || t.poi === 'opening' || t.poi === 'surface' || t.poi === 'deadend') continue;
      if (state.poisFound.includes(k)) continue;
      const d = hexDistance({q: t.q, r: t.r}, {q: c.q, r: c.r});
      if (d < bestD) { bestD = d; best = t; }
    }
    if (best) { c.tk = hexKey(best.q, best.r); c.tq = best.q; c.tr = best.r; }
  }
  if (c.tk) {
    const target = { q: c.tq, r: c.tr };
    const dT = hexDistance({q: c.q, r: c.r}, target);
    if (dT === 0) { c.working = 1; c.work = 3; return; }
    let best = null, bestD2 = dT;
    for (const n of hexNeighbors(c.q, c.r)) {
      if (!creatureCanEnter(c, n.q, n.r, c.depth)) continue;
      const d2 = hexDistance({q: n.q, r: n.r}, target);
      if (d2 < bestD2) { bestD2 = d2; best = n; }
    }
    if (best) { c.q = best.q; c.r = best.r; }
    else c.tk = null; // blocked at this depth — give it up, look again later
    return;
  }
  if (rand() < 0.4) {
    const nbrs = hexNeighbors(c.q, c.r).filter(n => creatureCanEnter(c, n.q, n.r, c.depth));
    if (nbrs.length) { const n = nbrs[Math.floor(rand() * nbrs.length)]; c.q = n.q; c.r = n.r; }
  }
}

function tickDrifter(c) {
  c.phase ^= 1;
  if (c.phase) return; // vast things move every other turn
  const nbrs = hexNeighbors(c.q, c.r).filter(n => creatureCanEnter(c, n.q, n.r, c.depth));
  if (nbrs.length && rand() < 0.75) {
    const n = nbrs[Math.floor(rand() * nbrs.length)];
    c.q = n.q; c.r = n.r;
  }
}

function tickLurker(c, dPlayer) {
  if (!c.awake) return;
  if (c.calm <= 0) { c.awake = false; return; }
  c.calm--;
  const sameSlice = Math.abs(c.depth - state.currentDepth) < DEPTH_GRID;
  if (sameSlice && dPlayer === 1) {
    const dmg = 5 + Math.floor(rand() * 6);
    state.hull = Math.max(0, state.hull - dmg);
    state.lastFailTime = performance.now();
    log(`Something slams the hull out of the dark. -${dmg} hull.`, 'danger', 'STRIKE');
    sfx('strike');
    c.calm = 9; // blood in the water — it stays interested
    return;
  }
  // Close on the prey if near, else on the last noise it heard.
  const target = dPlayer <= 12 ? { q: state.q, r: state.r } : { q: c.tq, r: c.tr };
  // Depth first: a hunter aligns its depth to the prey's, one band per turn.
  if (dPlayer <= 12 && c.depth !== state.currentDepth) {
    const dd = state.currentDepth > c.depth ? DEPTH_GRID : -DEPTH_GRID;
    if (c.depth + dd >= 0 && cells.has(cellKey(c.q, c.r, c.depth + dd))) { c.depth += dd; return; }
  }
  let best = null;
  let bestD = hexDistance({q: c.q, r: c.r}, target);
  for (const n of hexNeighbors(c.q, c.r)) {
    if (!creatureCanEnter(c, n.q, n.r, c.depth)) continue;
    const d = hexDistance({q: n.q, r: n.r}, target);
    if (d < bestD) { bestD = d; best = n; }
  }
  if (best) { c.q = best.q; c.r = best.r; }
}

// One creature turn after each player action. Also emits passive-sonar
// contact lines — the boat hears what it cannot see.
function creatureTick() {
  if (!state.alive) return;
  expeditionTick(); // dive teams work on the same clock the deep hunts on
  const now = performance.now();
  for (const c of state.creatures) {
    const d = hexDistance({q: c.q, r: c.r}, {q: state.q, r: state.r});
    if (d > CREATURE_SIM_RANGE) continue;
    if (c.type === 'drifter') tickDrifter(c);
    else if (c.type === 'eel') tickEel(c, d);
    else if (c.type === 'rival') tickRival(c, d);
    else tickLurker(c, d);
    const d2 = hexDistance({q: c.q, r: c.r}, {q: state.q, r: state.r});
    const depthOff = Math.abs(c.depth - state.currentDepth);
    if (d2 <= passiveContactR() && d2 > 1 && depthOff <= 2 * DEPTH_GRID &&
        (!state._lastContactLog || now - state._lastContactLog > CONTACT_LOG_MS)) {
      state._lastContactLog = now;
      const dir = bearing(state.q, state.r, c.q, c.r);
      const what = c.type === 'drifter' ? 'something vast, moving slow'
                 : c.type === 'eel' ? (c.carrying ? 'something small, fleeing fast' : 'something small and quick')
                 : c.type === 'rival' ? 'engine noise — another boat under power'
                 : c.awake ? 'something fast, closing'
                 : 'a faint heartbeat, holding still';
      const depthNote = depthOff >= DEPTH_GRID ? (c.depth > state.currentDepth ? ', below' : ', above') : '';
      log(`Passive sonar: ${what} — ${dir}, ${d2 * 60} m${depthNote}.`, c.awake ? 'danger' : 'strange', 'CONTACT');
      sfx('contact');
    }
  }
  // Reap anything that despawned this turn (caught or escaped thieves).
  if (state.creatures.some(c => c.gone)) {
    state.creatures = state.creatures.filter(c => !c.gone);
  }
}

// ---- Cell-model queries -------------------------------------------------
// The voxel `cells` map is the source of truth for "is there navigable space
// at (q,r,depth)?". These helpers answer the old volume questions by reading
// cells. A "volume" is reconstructed on demand as the contiguous vertical run
// of open cells around a depth — so callers that still expect {ceiling,floor}
// keep working, and vertically-adjacent open cells correctly read as one
// connected space (no phantom 60-m walls between stacked carves).
const MAX_DEPTH_SCAN = 12000; // the world generates no deeper than ~10,800 m

function cellAt(q, r, d) { return cells.get(cellKey(q, r, d)); }

// Expand the open run containing (q,r,d): walk up/down while cells stay open.
function cellRun(q, r, d) {
  if (!cells.has(cellKey(q, r, d))) return null;
  let ceiling = d, floor = d;
  while (ceiling - DEPTH_GRID >= 0 && cells.has(cellKey(q, r, ceiling - DEPTH_GRID))) ceiling -= DEPTH_GRID;
  while (cells.has(cellKey(q, r, floor + DEPTH_GRID))) floor += DEPTH_GRID;
  return { ceiling, floor, kind: cells.get(cellKey(q, r, d)).kind };
}

// The open run containing this depth, or null. Shape matches the old volume.
function volumeContaining(tile, depth) {
  if (!tile || tile.wall) return null;
  return cellRun(tile.q, tile.r, depth);
}

// Does this hex have an open cell exactly at this (grid-aligned) depth?
function hexAcceptsDepth(tile, depth) {
  return !!tile && !tile.wall && cells.has(cellKey(tile.q, tile.r, depth));
}

// Is this hex "near" the given depth — within two dive-steps (±120 m)? Surface
// land (shore/dock) is only visible near the surface. Pure stone has no body of
// its own; its presence is drawn as wall edges from adjacent open hexes.
function hexNearDepth(tile, depth) {
  if (!tile) return false;
  if (tile.wall) {
    if (tile.type === 'shore' || tile.type === 'dock') return depth <= DEPTH_GRID * 2;
    return false;
  }
  for (let o = -2; o <= 2; o++) {
    const d = depth + o * DEPTH_GRID;
    if (d >= 0 && cells.has(cellKey(tile.q, tile.r, d))) return true;
  }
  return false;
}

// Nearest open run to fromDepth (smallest vertical move). Returns
// { volume:{ceiling,floor,kind}, deltaMeters } or null. On a tie the run above
// wins, matching the old volume-order tie-break.
function nearestVolume(tile, fromDepth) {
  if (!tile || tile.wall) return null;
  if (cells.has(cellKey(tile.q, tile.r, fromDepth))) {
    return { volume: cellRun(tile.q, tile.r, fromDepth), deltaMeters: 0 };
  }
  for (let step = 1; step * DEPTH_GRID <= MAX_DEPTH_SCAN; step++) {
    const up = fromDepth - step * DEPTH_GRID;
    const dn = fromDepth + step * DEPTH_GRID;
    if (up >= 0 && cells.has(cellKey(tile.q, tile.r, up))) {
      return { volume: cellRun(tile.q, tile.r, up), deltaMeters: step * DEPTH_GRID };
    }
    if (cells.has(cellKey(tile.q, tile.r, dn))) {
      return { volume: cellRun(tile.q, tile.r, dn), deltaMeters: step * DEPTH_GRID };
    }
  }
  return null;
}

// Apply air cost, pressure damage, update maxDepth.
// Log when the player crosses a geographic zone boundary. Fires once per
// transition direction, with prose appropriate to leaving or returning.
function detectZoneTransition(q, r) {
  const newZone = hexZone(q, r);
  const prevZone = state.lastZone;
  if (newZone === prevZone) return;
  const newRank = zoneRank(newZone);
  const prevRank = zoneRank(prevZone);
  state.lastZone = newZone;
  const firstTime = newRank > state.maxZoneReached;
  if (newRank > state.maxZoneReached) state.maxZoneReached = newRank;

  if (newRank > prevRank) {
    // Moving outward — leaving the more familiar zone
    if (newZone === 'shelf-edge') {
      log(firstTime
        ? 'The seafloor falls away beneath you. You are off the continental shelf.'
        : 'The seafloor falls away. Off the shelf again.',
        '', 'OFF SHELF');
    } else if (newZone === 'deep') {
      log(firstTime
        ? 'No floor returns the ping. You are over the abyss.'
        : 'The abyss again. No floor.',
        'strange', 'ABYSS');
    }
  } else {
    // Moving inward — returning to a more familiar zone
    if (newZone === 'shelf') {
      log('Solid ground beneath you again. The shelf returns.', '', 'SHELF');
    } else if (newZone === 'shelf-edge') {
      log('A floor returns to the sonar. The cliff is behind you.', '', 'SHELF EDGE');
    }
  }
}

// Replenish air when the boat is at depth 0 (hatch open, venting to atmosphere).
// Called from both horizontal and vertical moves so any action at the surface
// gives back air.
function surfaceAirRecovery(amount) {
  const sub = activeSub();
  if (state.currentDepth > 0) return;
  if (state.air >= sub.air) return;
  state.air = Math.min(sub.air, state.air + (amount || 8));
}

// Tick ping memory — each turn, every remembered hex loses one freshness.
// Hexes that drop to 0 are forgotten (their wall edges become invisible again
// unless they're inside passive sonar range).
function tickPingMemory() {
  for (const [k, turns] of state.pingMemory) {
    if (turns <= 1) state.pingMemory.delete(k);
    else state.pingMemory.set(k, turns - 1);
  }
}

function applyMoveCosts(tileCostMultiplier) {
  const sub = activeSub();
  // At depth 0 — hatch open, boat passively replenishes air with each move.
  if (state.currentDepth <= 0) {
    surfaceAirRecovery(8);
    return;
  }
  const depthFactor = 1 + state.currentDepth / 400;
  const airCost = Math.max(1, Math.round(sub.airBase * tileCostMultiplier * depthFactor));
  state.air = Math.max(0, state.air - airCost);

  if (state.currentDepth > sub.safeDepth) {
    const over = state.currentDepth - sub.safeDepth;
    const dmg = Math.max(1, Math.round(over * sub.pressurePerMeter));
    state.hull = Math.max(0, state.hull - dmg);
    if (state.currentDepth > sub.crushDepth) {
      log(`Past crush depth. The hull screams.`, 'danger', 'PRESSURE');
    } else if (over > 50) {
      log(`The hull groans under the pressure.`, 'warn', 'PRESSURE');
    }
  }

  state.maxDepth = Math.max(state.maxDepth, state.currentDepth);
}

function checkDeath() {
  if (state.air <= 0 && state.alive) {
    state.alive = false;
    setTimeout(() => endGame('The air is gone.', 'The scrubbers fail. The boat goes quiet.'), 700);
  } else if (state.hull <= 0 && state.alive) {
    state.alive = false;
    setTimeout(() => endGame('The hull fails.', 'The pressure finds every seam at once.'), 700);
  }
}

// Vertical movement — ascend or descend by step meters.
// Clamps to the volume the player is currently in. To reach another volume in
// the same hex requires there to be no stone between them (i.e., volumes have
// been merged or there's an opening shaft connecting them).
function changeDepth(deltaMeters) {
  if (!state.alive) return;
  const sub = activeSub();
  const tile = getTile(state.q, state.r);
  if (!tile || tile.wall) return;

  // Find the volume the player is currently in. If somehow not in any, snap to nearest.
  let cur = volumeContaining(tile, state.currentDepth);
  if (!cur) {
    const n = nearestVolume(tile, state.currentDepth);
    if (!n) return;
    cur = n.volume;
    state.currentDepth = Math.max(cur.ceiling, Math.min(cur.floor, state.currentDepth));
  }

  const targetDepth = Math.max(0, state.currentDepth + deltaMeters);
  const actual = Math.max(cur.ceiling, Math.min(cur.floor, targetDepth));
  if (actual === state.currentDepth) {
    // Hit a boundary. Striking rock damages the hull whether the collision
    // is horizontal or vertical — driving the sub into a chamber ceiling
    // is just as much "striking rock" as driving it into a side wall.
    // Exception: reaching the surface from below is a soft stop (no rock).
    if (deltaMeters > 0) {
      // Floor: striking rock below (seabed or chamber floor)
      const dmg = 4 + Math.floor(rand() * 5);
      state.hull = Math.max(0, state.hull - dmg);
      const what = cur.kind === 'water' ? 'The seabed' : 'The chamber floor';
      log(`${what} stops the dive. -${dmg} hull.`, 'danger', 'IMPACT');
      flagMoveFail(state.q, state.r, '#a04030');
      state.lastMoveTime = performance.now();
      noiseMade(state.q, state.r, 2); // impacts ring through the water
      sfx('impact');
      creatureTick();
      checkDeath();
    } else {
      // Ceiling: surface is soft, chamber ceiling and shallow-water cap are rock
      if (state.currentDepth <= 0) {
        log('You are at the surface.', 'warn');
      } else {
        const dmg = 4 + Math.floor(rand() * 5);
        state.hull = Math.max(0, state.hull - dmg);
        const what = cur.kind === 'water' ? 'The shallows' : 'The chamber ceiling';
        log(`${what} stops the rise. -${dmg} hull.`, 'danger', 'IMPACT');
        flagMoveFail(state.q, state.r, '#a04030');
        state.lastMoveTime = performance.now();
        checkDeath();
      }
    }
    updateHUD();
    return;
  }
  const prevDepth = state.currentDepth;
  state.currentDepth = actual;
  state.moves++;
  state.lastMoveTime = performance.now();
  state.pingArrows = null; // depth-relative distances now stale
  tickPingMemory();

  // Vertical air cost (free at depth 0)
  if (state.currentDepth > 0) {
    const absDelta = Math.abs(deltaMeters);
    const fastFactor = absDelta > sub.diveStep ? sub.diveAirCostFast / sub.diveAirCost : 1;
    const airCost = Math.max(1, Math.round(sub.diveAirCost * fastFactor));
    state.air = Math.max(0, state.air - airCost);
  } else {
    // Reached the surface — recover air and log a breach if we just came up
    surfaceAirRecovery(8);
    if (prevDepth > 1) {
      log(pickFlavor(FLAVOR.breach), '', 'SURFACE');
    }
  }

  // Blowing ballast is LOUD. A fast vertical run rings through the water —
  // every hunter in earshot now knows where you are. Silence is a speed.
  if (Math.abs(deltaMeters) > sub.diveStep) {
    noiseMade(state.q, state.r, 2);
    sfx('ballast');
    if (rand() < 0.25) log('The ballast tanks roar. The sound carries.', 'warn');
  }

  if (state.currentDepth > sub.safeDepth) {
    const over = state.currentDepth - sub.safeDepth;
    const dmg = Math.max(1, Math.round(over * sub.pressurePerMeter * 0.5));
    state.hull = Math.max(0, state.hull - dmg);
    sfx('groan'); // the pressure sings against the plates
  }
  state.maxDepth = Math.max(state.maxDepth, state.currentDepth);

  // Z-axis context — describe what's above and below the sub in the current hex.
  // Only log when there's a meaningful Z context (vertical space > 30 meters), and
  // throttle to avoid spam on small back-and-forth movements.
  logZContext(tile, cur);

  creatureTick();
  checkDeath();
  updateHUD();
  render();
}

function logZContext(tile, currentVolume) {
  if (!tile || tile.wall) return;
  const now = performance.now();
  if (state._lastZContextLog && now - state._lastZContextLog < 800) return;
  // Always recompute the current volume in case state.currentDepth shifted.
  const vol = volumeContaining(tile, state.currentDepth) || currentVolume;
  if (!vol) return;
  const above = state.currentDepth - vol.ceiling;
  const below = vol.floor - state.currentDepth;

  // Only report what's reachable in the sub's current volume — sonar bounces
  // off the volume's ceiling and floor. Any opening beyond stone (a separate
  // volume in the same hex with rock between) is unknown to the sub. At the
  // surface (depth 0), the "ceiling" is the sky — don't pretend it's a roof.
  const atSurface = state.currentDepth <= 0;
  let line = null;
  if (atSurface) {
    // Surface sounding describes only what's below, never above
    if (below >= 30) line = `Open water ${Math.round(below)} m below.`;
  } else if (above >= 30 && below >= 30) {
    line = `Open water ${Math.round(above)} m above, ${Math.round(below)} m below.`;
  } else if (above >= 30) {
    line = `Open water ${Math.round(above)} m above. The floor is just below.`;
  } else if (below >= 30) {
    line = `The ceiling is just above. Open water ${Math.round(below)} m below.`;
  }
  if (line) {
    log(line, '', 'SOUNDING');
    state._lastZContextLog = now;
  }
}

// Tap-to-identify a POI hex. Logs a description of what sonar reports about
// that hex, including distance and depth offset. Costs nothing.
function identifyPoi(tile) {
  if (!tile || !tile.poi) return;
  const dist = hexDistance({q: tile.q, r: tile.r}, {q: state.q, r: state.r});
  const meters = dist * 60;
  const dir = bearing(state.q, state.r, tile.q, tile.r);
  // Tappable glyphs always share the sub's depth slice (the render gate
  // requires hexAcceptsDepth), so there is never a vertical offset to hint.
  const depthHint = '';
  const desc = POI_DESCRIPTIONS[tile.poi] || tile.name || 'an unknown reading';
  const tag = (tile.poi === 'signal' || tile.poi === 'growth') ? 'STRANGE'
            : (tile.poi === 'air')    ? 'AIR'
            : (tile.poi === 'opening') ? 'OPENING'
            : 'ECHO';
  const cls = (tag === 'STRANGE') ? 'strange' : (tag === 'AIR' ? 'warn' : '');
  if (dist === 0) {
    log(`${desc} — you are over it.`, cls, tag);
  } else {
    log(`${desc} ${dir}, ${meters} m out${depthHint}.`, cls, tag);
  }
}

// At-a-distance descriptions — what the sonar paints, not what you'd see
// once close. Keyed by POI tag.
const POI_DESCRIPTIONS = {
  ruin:     'A sunken structure',
  signal:   'A repeating signal',
  growth:   'A mass of unnatural growth',
  air:      'A pocket of trapped gas',
  salvage:  'Wreckage on the bottom',
  opening:  'A sinkhole through the seafloor',
  surface:  'The dock and the shore',
  deadend:  'A dead end',
};

function handleTile(tile) {
  // First-time visits get a flavor log
  const firstVisit = !state.poisFound.includes(hexKey(tile.q, tile.r));
  const atSurface = state.currentDepth <= 1;
  const inShallow = !atSurface && state.currentDepth < 200;

  // Ambient depth-aware flavor takes priority over tile-type flavor.
  // At the surface, surface vocabulary. In open water below the surface but
  // above 200 meters, openWater vocabulary. Only at >= 200 meters do we use
  // the cave/passage/chamber vocabulary, regardless of tile type.
  if (atSurface && (firstVisit || rand() < 0.18)) {
    log(pickFlavor(FLAVOR.surface));
    // Adjacent-dock prose: fires when neighboring a dock from the surface
    maybeLogDockAdjacent();
    // Occasional porthole view from the starter sub
    maybePorthole();
    return;
  }
  if (inShallow && (firstVisit || rand() < 0.14)) {
    log(pickFlavor(FLAVOR.openWater));
    maybePorthole();
    return;
  }

  switch (tile.type) {
    case 'passage':
      if (firstVisit && state.currentDepth >= 200 && rand() < 0.20) log(pickFlavor(FLAVOR.passage));
      maybePorthole();
      break;
    case 'chamber':
      if (firstVisit && state.currentDepth >= 200 && rand() < 0.40) log(pickFlavor(FLAVOR.chamber));
      maybePorthole();
      break;
    case 'current':
      log('The current pulls at your hull.', 'warn', 'DRIFT');
      if (chance(0.4)) {
        const adj = hexNeighbors(state.q, state.r).filter(n => !tileAt(n.q, n.r).wall);
        if (adj.length) {
          const push = pick(adj);
          state.q = push.q; state.r = push.r;
          state.air = Math.max(0, state.air - 1);
          visited.add(hexKey(push.q, push.r));
        }
      }
      break;
    case 'kelp':
      if (firstVisit) log(pickFlavor(FLAVOR.kelp));
      state.poisFound.push(hexKey(tile.q, tile.r));
      break;
    case 'chasm':
      if (firstVisit) log(pickFlavor(FLAVOR.chasm), 'strange');
      state.poisFound.push(hexKey(tile.q, tile.r));
      break;
    case 'air':
      if (firstVisit) {
        // Gas collects at the ceiling — you rise to it to vent and refill.
        if (Math.abs(state.currentDepth - tile.ceiling) > DEPTH_GRID) {
          if (rand() < 0.5) log('Sonar reads trapped gas pooled at the ceiling above. Rise to vent.', 'warn', 'AIR');
          break;
        }
        const subA = activeSub();
        const fillAmount = Math.round(subA.air * 0.2); // 20% of max air
        const gained = Math.min(fillAmount, subA.air - state.air);
        state.air = Math.min(subA.air, state.air + fillAmount);
        log(`A pocket of trapped gas. The boat vents its scrubbers and tops up the reserves. (+${gained} air)`, '', 'AIR');
        state.poisFound.push(hexKey(tile.q, tile.r));
        setTile(tile.q, tile.r, 'passage');
      }
      break;
    case 'salvage':
      if (firstVisit) {
        // Wreckage rests on the bottom — you dive to it, not over it.
        if (Math.abs(state.currentDepth - tile.floor) > DEPTH_GRID) {
          if (rand() < 0.5) log('The wreck lies on the floor below. Descend to work it.', 'warn', 'SALVAGE');
          break;
        }
        const subS = activeSub();
        const repair = 20 + randInt(15);
        state.hull = Math.min(subS.hull, state.hull + repair);
        state.cargo++;
        log(`Wreckage. You patch the hull with what fits and winch a crate aboard. (+${repair} hull, +1 cargo)`, '', 'SALVAGE');
        state.poisFound.push(hexKey(tile.q, tile.r));
        setTile(tile.q, tile.r, 'passage');
      }
      break;
    case 'ruin':
      if (firstVisit) {
        // Ruins rest on the floor like wrecks — put the boat on the bottom
        // before the divers go over. (Site is spent by the expedition.)
        if (Math.abs(state.currentDepth - tile.floor) > DEPTH_GRID) {
          if (rand() < 0.5) log('The ruin lies broken on the floor below. Descend to put divers on it.', 'warn', 'FOUND');
          break;
        }
        if (!state.expedition) {
          log(pickFlavor(FLAVOR.ruin), '', 'FOUND');
          startExpedition(tile, 'ruin');
        }
      }
      break;
    case 'signal':
      if (firstVisit) {
        if (!state.expedition) {
          log(pickFlavor(FLAVOR.signal), 'strange', 'SIGNAL');
          startExpedition(tile, 'signal');
        }
      }
      break;
    case 'growth':
      if (firstVisit) {
        log(pickFlavor(FLAVOR.growth), 'strange', 'STRANGE');
        const dmg = 5 + randInt(10);
        state.hull = Math.max(0, state.hull - dmg);
        state.poisFound.push(hexKey(tile.q, tile.r));
      }
      break;
    case 'opening':
      if (firstVisit) {
        log('A sinkhole opens beneath you. The seafloor falls away into dark.', 'strange', 'OPENING');
        state.poisFound.push(hexKey(tile.q, tile.r));
      }
      break;
    case 'surface':
      if (atSurface) state.air = activeSub().air;
      break;
  }
}

// Log a dock-adjacent flavor line if any neighbor is a dock hex.
// Fires at most once per visit by tracking a recent-trigger guard.
function maybeLogDockAdjacent() {
  // Only at the surface; only if we haven't done this very recently
  const now = performance.now();
  if (state._lastDockLog && now - state._lastDockLog < 5000) return;
  const adj = hexNeighbors(state.q, state.r);
  for (const n of adj) {
    const t = world.get(hexKey(n.q, n.r));
    if (t && t.type === 'dock') {
      log(pickFlavor(FLAVOR.dockAdjacent));
      state._lastDockLog = now;
      return;
    }
  }
}

// Occasionally log a porthole view if the active sub has one.
function maybePorthole() {
  const sub = activeSub();
  if (!sub.porthole) return;
  // ~1 in 4 moves shows the porthole, so it's a small character moment, not spam
  if (rand() > 0.22) return;
  const d = state.currentDepth;
  let pool;
  if (d <= 1) pool = FLAVOR.porthole.surface;
  else if (d < 250) pool = FLAVOR.porthole.shallow;
  else pool = FLAVOR.porthole.deep;

const logEl = document.getElementById('log');
const logHistory = [];

function log(text, cls, echo) {
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  if (echo) {
    const e = document.createElement('span');
    e.className = 'echo ' + (cls || '');
    e.textContent = echo;
    entry.appendChild(e);
  }
  entry.appendChild(document.createTextNode(text));

  // Demote older entries
  for (const old of logEl.children) {
    old.classList.add('old');
  }

  logEl.appendChild(entry);
  logHistory.push({text, cls, echo});

  // Keep only last 3 visible
  while (logEl.children.length > 3) logEl.removeChild(logEl.firstChild);
}

function updateHUD() {
  const sub = activeSub();
  document.getElementById('air-val').textContent = state.air;
  document.getElementById('air-bar').style.width = (state.air / sub.air * 100) + '%';
  document.getElementById('hull-val').textContent = state.hull;
  document.getElementById('hull-bar').style.width = (state.hull / sub.hull * 100) + '%';
  // Depth in meters. Display as "1250 m" or "1.2k m"
  const d = state.currentDepth;
  let depthLabel = Math.round(d) + ' m';
  if (d >= 1000) depthLabel = (d / 1000).toFixed(1) + 'k m';
  document.getElementById('depth-val').textContent = depthLabel;
  // Bar scales logarithmically
  const depthPct = Math.min(100, Math.log10(Math.max(1, d)) * 25);
  document.getElementById('depth-bar').style.width = depthPct + '%';

  // Color states — thresholds are percentages of max so they scale with sub.
  const airPct = state.air / sub.air;
  const airEl = document.getElementById('air-val');
  const airBar = document.getElementById('air-bar');
  airEl.className = 'stat-value';
  airBar.className = 'bar-fill';
  if (airPct < 0.25) { airEl.classList.add('danger'); airBar.classList.add('danger'); }
  else if (airPct < 0.50) { airEl.classList.add('warn'); airBar.classList.add('warn'); }

  const hullPct = state.hull / sub.hull;
  const hullEl = document.getElementById('hull-val');
  const hullBar = document.getElementById('hull-bar');
  hullEl.className = 'stat-value';
  hullBar.className = 'bar-fill';
  if (hullPct < 0.25) { hullEl.classList.add('danger'); hullBar.classList.add('danger'); }
  else if (hullPct < 0.50) { hullEl.classList.add('warn'); hullBar.classList.add('warn'); }

  // Pressure indicator on depth bar
  const depthBar = document.getElementById('depth-bar');
  depthBar.className = 'bar-fill';
  if (state.currentDepth > sub.crushDepth) depthBar.classList.add('danger');
  else if (state.currentDepth > sub.safeDepth) depthBar.classList.add('warn');

  // Update vertical depth strip if present
  updateDepthStrip();
  scheduleSave();
}
